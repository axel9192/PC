name: Windows Cloud PC

on:
  workflow_dispatch:

jobs:
  cloud-pc:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:

      - name: Preparar Windows oscuro
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "   WINDOWS CLOUD PC"
          Write-Host "   Preparando entorno..."
          Write-Host "========================================"

          # Tema oscuro de Windows 11
          New-Item "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" -Force | Out-Null

          Set-ItemProperty `
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" `
            AppsUseLightTheme `
            0

          Set-ItemProperty `
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize" `
            SystemUsesLightTheme `
            0

          # Fondo oscuro
          Set-ItemProperty `
            "HKCU:\Control Panel\Colors" `
            Background `
            "20 20 20"

          Write-Host "[OK] Tema oscuro activado."
          Write-Host "[OK] Fondo oscuro configurado."

      - name: Descargar UltraVNC
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[1/4] Descargando UltraVNC 1.8.3.0..."

          $zip = "$env:TEMP\UltraVNC.zip"

          Invoke-WebRequest `
            "https://uvnc.eu/download/1800/UltraVNC_1830.zip" `
            -OutFile $zip

          Expand-Archive `
            $zip `
            "C:\UltraVNC" `
            -Force

          Write-Host "[OK] UltraVNC descargado."

      - name: Configurar y arrancar UltraVNC
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[2/4] Configurando UltraVNC..."

          $vnc = Get-ChildItem `
            "C:\UltraVNC" `
            -Filter "winvnc.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$vnc) {
            throw "No se encontró winvnc.exe"
          }

          Write-Host "[OK] WinVNC encontrado:"
          Write-Host "     $($vnc.FullName)"

          $configDir = "C:\ProgramData\UltraVNC"

          New-Item `
            $configDir `
            -ItemType Directory `
            -Force | Out-Null

          $ini = Join-Path $configDir "ultravnc.ini"

          if (Test-Path "$($vnc.DirectoryName)\ultravnc.ini") {
            Copy-Item `
              "$($vnc.DirectoryName)\ultravnc.ini" `
              $ini `
              -Force
          }

          # Crear contraseña UltraVNC: 12345678
          $cpZip = "$env:TEMP\createpassword.zip"

          Invoke-WebRequest `
            "https://uvnc.eu/download/133/createpassword.zip" `
            -OutFile $cpZip

          Expand-Archive `
            $cpZip `
            "$env:TEMP\createpassword" `
            -Force

          $cp = Get-ChildItem `
            "$env:TEMP\createpassword" `
            -Filter "createpassword64.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($cp) {
            Push-Location $configDir

            & $cp.FullName secure 1
            & $cp.FullName secure 12345678

            Pop-Location

            Write-Host "[OK] Contraseña configurada: 12345678"
          }
          else {
            Write-Host "[!] No se encontró createpassword64."
          }

          Start-Process `
            $vnc.FullName `
            -WorkingDirectory $vnc.DirectoryName

          Start-Sleep -Seconds 5

          Write-Host "[OK] UltraVNC iniciado."

      - name: Comprobar servidor web
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[3/4] Comprobando noVNC integrado..."
          Write-Host "      Puerto: 5800"

          $ready = $false

          for ($i = 1; $i -le 15; $i++) {

            $test = Test-NetConnection `
              127.0.0.1 `
              -Port 5800 `
              -WarningAction SilentlyContinue

            if ($test.TcpTestSucceeded) {
              $ready = $true
              break
            }

            Write-Host "      Esperando... ($i/15)"
            Start-Sleep -Seconds 2
          }

          if (!$ready) {
            throw "UltraVNC no abrió el puerto 5800."
          }

          Write-Host "[OK] Servidor web disponible."
          Write-Host "[OK] http://127.0.0.1:5800"

      - name: Crear Cloudflare URL
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[4/4] Iniciando Cloudflare..."
          Write-Host ""
          Write-Host "========================================"
          Write-Host "        CONECTANDO CLOUD PC"
          Write-Host "========================================"

          $cf = "C:\cloudflared.exe"

          Invoke-WebRequest `
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cf

          Write-Host "[OK] Cloudflared descargado."
          Write-Host "[OK] Creando Quick Tunnel..."
          Write-Host ""
          Write-Host "TU URL APARECERÁ ABAJO:"
          Write-Host ""

          & $cf tunnel `
            --no-autoupdate `
            --protocol http2 `
            --url http://127.0.0.1:5800
