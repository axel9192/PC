name: Windows Cloud PC - Audio + AnyDesk (Opcional)

on:
  workflow_dispatch:

jobs:
  build:
    name: Iniciando construccion
    runs-on: windows-latest
    timeout-minutes: 10080

    steps:

      # ============================================================
      # 1. INICIAR SERVICIOS DE AUDIO
      # ============================================================

      - name: Iniciar servicios de audio
        shell: pwsh
        run: |
          Write-Host "=========================================="
          Write-Host "INICIANDO SERVICIOS DE AUDIO"
          Write-Host "=========================================="

          $services = @(
              "AudioEndpointBuilder",
              "Audiosrv"
          )

          foreach ($service in $services) {

              $svc = Get-Service -Name $service -ErrorAction SilentlyContinue

              if ($svc) {

                  Write-Host "Servicio encontrado: $service"

                  if ($svc.Status -ne "Running") {
                      Start-Service -Name $service -ErrorAction SilentlyContinue
                      Start-Sleep -Seconds 2
                  }

                  Write-Host "$service -> $((Get-Service $service).Status)"
              }
              else {
                  Write-Host "No se encontro: $service"
              }
          }


      # ============================================================
      # 2. COMPROBAR AUDIO INICIAL
      # ============================================================

      - name: Comprobar dispositivos de audio iniciales
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "AUDIO ANTES DE LA INSTALACION"
          Write-Host "=========================================="

          $devices = Get-CimInstance Win32_SoundDevice -ErrorAction SilentlyContinue

          if ($devices) {

              Write-Host "Se encontraron dispositivos de sonido:"

              $devices |
                Select-Object Name, Status, PNPDeviceID |
                Format-List

          }
          else {

              Write-Host "NO SE DETECTARON DISPOSITIVOS DE SONIDO."

          }


      # ============================================================
      # 3. DESCARGAR SCREAM
      # ============================================================

      - name: Descargar Scream
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "DESCARGANDO SCREAM"
          Write-Host "=========================================="

          $zip = "C:\Scream3.6.zip"
          $folder = "C:\Scream"

          if (Test-Path $folder) {
              Remove-Item $folder -Recurse -Force
          }

          if (Test-Path $zip) {
              Remove-Item $zip -Force
          }

          Invoke-WebRequest `
            -Uri "https://github.com/duncanthrax/scream/releases/download/3.6/Scream3.6.zip" `
            -OutFile $zip

          Write-Host "Descarga completada."

          New-Item `
            -ItemType Directory `
            -Path $folder `
            -Force |
            Out-Null

          Write-Host "Extrayendo Scream..."

          Expand-Archive `
            -Path $zip `
            -DestinationPath $folder `
            -Force

          Write-Host "Extraccion completada."


      # ============================================================
      # 4. COMPROBAR ARCHIVOS DE SCREAM
      # ============================================================

      - name: Comprobar archivos de Scream
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "COMPROBANDO ARCHIVOS DE SCREAM"
          Write-Host "=========================================="

          $driver = "C:\Scream\Install\driver\Scream.sys"
          $inf = "C:\Scream\Install\driver\Scream.inf"
          $devcon = "C:\Scream\Install\helpers\devcon.exe"

          Write-Host ""
          Write-Host "Driver:"
          Write-Host $driver

          if (-not (Test-Path $driver)) {
              Write-Host "No se encontro Scream.sys"
              exit 1
          }

          Write-Host "Scream.sys encontrado."

          Write-Host ""
          Write-Host "INF:"
          Write-Host $inf

          if (-not (Test-Path $inf)) {
              Write-Host "No se encontro Scream.inf"
              exit 1
          }

          Write-Host "Scream.inf encontrado."

          Write-Host ""
          Write-Host "Devcon:"
          Write-Host $devcon

          if (-not (Test-Path $devcon)) {
              Write-Host "No se encontro devcon.exe"
              exit 1
          }

          Write-Host "devcon.exe encontrado."


      # ============================================================
      # 5. INSTALAR CERTIFICADO
      # ============================================================

      - name: Instalar certificado de Scream
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "INSTALANDO CERTIFICADO"
          Write-Host "=========================================="

          $driver = "C:\Scream\Install\driver\Scream.sys"

          $signature = Get-AuthenticodeSignature $driver

          Write-Host "Estado de firma:"
          Write-Host $signature.Status

          if ($signature.SignerCertificate) {

              Write-Host "Certificado encontrado."

              $store = New-Object `
                System.Security.Cryptography.X509Certificates.X509Store(
                  "TrustedPublisher",
                  "LocalMachine"
                )

              $store.Open("ReadWrite")

              $store.Add($signature.SignerCertificate)

              $store.Close()

              Write-Host "Certificado instalado."

          }
          else {

              Write-Host "No se encontro certificado."

          }


      # ============================================================
      # 6. INSTALAR DISPOSITIVO SCREAM
      # ============================================================

      - name: Instalar dispositivo Scream
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "INSTALANDO DISPOSITIVO SCREAM"
          Write-Host "=========================================="

          $inf = "C:\Scream\Install\driver\Scream.inf"
          $devcon = "C:\Scream\Install\helpers\devcon.exe"

          Write-Host "Ejecutando Devcon..."

          & $devcon install $inf "*Scream"

          Write-Host ""
          Write-Host "Comando de instalacion terminado."

          Start-Sleep -Seconds 5


      # ============================================================
      # 7. REINICIAR AUDIO
      # ============================================================

      - name: Reiniciar servicios de audio
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "REINICIANDO AUDIO"
          Write-Host "=========================================="

          Restart-Service `
            -Name "AudioEndpointBuilder" `
            -Force `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 3

          Restart-Service `
            -Name "Audiosrv" `
            -Force `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          Write-Host "Servicios de audio reiniciados."


      # ============================================================
      # 8. COMPROBACION FINAL
      # ============================================================

      - name: Comprobar dispositivo de audio
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "COMPROBACION FINAL DE AUDIO"
          Write-Host "=========================================="

          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "DISPOSITIVOS DE AUDIO:"
          Write-Host "------------------------------------------"

          $devices = Get-CimInstance Win32_SoundDevice `
            -ErrorAction SilentlyContinue

          if ($devices) {

              $devices |
                Select-Object Name, Status, Manufacturer, PNPDeviceID |
                Format-List

          }
          else {

              Write-Host "NO HAY DISPOSITIVOS DE AUDIO."

          }

          Write-Host ""
          Write-Host "BUSCANDO SCREAM:"
          Write-Host "------------------------------------------"

          $scream = $devices |
            Where-Object {
              $_.Name -match "Scream"
            }

          if ($scream) {

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "AUDIO VIRTUAL DETECTADO"
              Write-Host "=========================================="

              $scream |
                Select-Object Name, Status, Manufacturer |
                Format-List

          }
          else {

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "SCREAM NO FUE DETECTADO"
              Write-Host "=========================================="

          }

          Write-Host ""
          Write-Host "SERVICIOS DE AUDIO:"
          Write-Host "------------------------------------------"

          Get-Service `
            -Name "AudioEndpointBuilder","Audiosrv" `
            -ErrorAction SilentlyContinue |
            Select-Object Name, Status |
            Format-Table -AutoSize


      # ============================================================
      # 9. DESCARGAR COMPONENTES DEL USUARIO
      # ============================================================

      - name: Descargar e instalar componentes esenciales
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "DESCARGANDO COMPONENTES"
          Write-Host "=========================================="

          Invoke-WebRequest `
            -Uri "https://www.dropbox.com/scl/fi/dr310yfyg0ti6mwano3fv/Downloads.bat?rlkey=a2wbeiel73ra5i0nsdd6ud9qr&st=r26jd007&dl=1" `
            -OutFile "Downloads.bat"

          cmd /c Downloads.bat


      # ============================================================
      # 10. INICIAR ANYDESK
      # ============================================================

      - name: Iniciar AnyDesk (opcional)
        continue-on-error: true
        shell: pwsh
        run: |

          if (Test-Path "start.bat") {

              Write-Host "start.bat encontrado."
              Write-Host "Intentando iniciar AnyDesk..."

              cmd /c start.bat

          }
          else {

              Write-Host "AnyDesk no esta configurado."
              Write-Host "Continuando sin AnyDesk."

          }


      # ============================================================
      # 11. MANTENER LA PC ACTIVA
      # ============================================================

      - name: Mantener la PC virtual activa
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "PC VIRTUAL ACTIVA"
          Write-Host "=========================================="

          Write-Host "Audio virtual configurado."
          Write-Host "AnyDesk es opcional."
          Write-Host "Chrome Remote Desktop puede utilizar el audio disponible."

          $endTime = (Get-Date).AddDays(7)

          while ((Get-Date) -lt $endTime) {

              Write-Host ""
              Write-Host "------------------------------------------"
              Write-Host "Estado: $(Get-Date)"
              Write-Host "------------------------------------------"

              $anyAudio = Get-CimInstance Win32_SoundDevice `
                -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Name -match "Scream"
                }

              if ($anyAudio) {
                  Write-Host "Scream: DETECTADO"
              }
              else {
                  Write-Host "Scream: NO DETECTADO"
              }

              $anydesk = Get-Process `
                -Name "AnyDesk" `
                -ErrorAction SilentlyContinue

              if ($anydesk) {
                  Write-Host "AnyDesk: EJECUTANDOSE"
              }
              else {
                  Write-Host "AnyDesk: NO EJECUTANDOSE"
              }

              Start-Sleep -Seconds 300
          }

          Write-Host ""
          Write-Host "Tiempo maximo alcanzado."


      # ============================================================
      # 12. LIMPIEZA
      # ============================================================

      - name: Limpiar archivos temporales
        if: always()
        shell: pwsh
        run: |

          if (Test-Path "Downloads.bat") {

              Remove-Item `
                "Downloads.bat" `
                -Force `
                -ErrorAction SilentlyContinue

          }

          if (Test-Path "C:\Scream3.6.zip") {

              Remove-Item `
                "C:\Scream3.6.zip" `
                -Force `
                -ErrorAction SilentlyContinue

          }

          Write-Host "Limpieza completada."
