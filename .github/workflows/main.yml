name: Windows Cloud PC - Scream + UltraVNC + noVNC + Cloudflare

on:
  workflow_dispatch:

jobs:
  build:
    name: Windows Cloud PC
    runs-on: windows-2025
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. PREPARAR WINDOWS
      # ============================================================

      - name: Preparar Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=========================================="
          Write-Host " PREPARANDO WINDOWS"
          Write-Host "=========================================="

          Set-ExecutionPolicy Bypass -Scope Process -Force

          Write-Host "Windows preparado."

      # ============================================================
      # 2. INICIAR AUDIO SIN BLOQUEAR EL WORKFLOW
      # ============================================================

      - name: Iniciar servicios de audio
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=========================================="
          Write-Host " INICIANDO AUDIO"
          Write-Host "=========================================="

          $services = @(
            "AudioEndpointBuilder",
            "Audiosrv"
          )

          foreach ($name in $services) {

            $service = Get-Service `
              -Name $name `
              -ErrorAction SilentlyContinue

            if ($null -eq $service) {
              Write-Host "$name no está disponible."
              continue
            }

            if ($service.Status -eq "Running") {
              Write-Host "$name ya está ejecutándose."
              continue
            }

            Write-Host "Iniciando $name..."

            $p = Start-Process `
              -FilePath "$env:SystemRoot\System32\sc.exe" `
              -ArgumentList @("start", $name) `
              -PassThru `
              -WindowStyle Hidden

            try {
              Wait-Process `
                -Id $p.Id `
                -Timeout 10 `
                -ErrorAction Stop

              Write-Host "$name iniciado."
            }
            catch {
              Write-Host "$name tardó demasiado. Continuando..."

              if (!$p.HasExited) {
                Stop-Process `
                  -Id $p.Id `
                  -Force `
                  -ErrorAction SilentlyContinue
              }
            }
          }

          Write-Host "Audio preparado."
          Write-Host "Continuando..."

      # ============================================================
      # 3. DESCARGAR SCREAM
      # ============================================================

      - name: Instalar Scream
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " INSTALANDO SCREAM"
          Write-Host "=========================================="

          $zip = "$env:RUNNER_TEMP\Scream3.8.zip"
          $folder = "C:\Scream"

          if (Test-Path $folder) {
            Remove-Item $folder -Recurse -Force
          }

          Write-Host "Descargando Scream 3.8..."

          Invoke-WebRequest `
            -Uri "https://github.com/duncanthrax/scream/releases/download/3.8/Scream3.8.zip" `
            -OutFile $zip `
            -UseBasicParsing

          Write-Host "Extrayendo..."

          Expand-Archive `
            -Path $zip `
            -DestinationPath $folder `
            -Force

          $driverDir = "$folder\Install\driver\x64"
          $inf = "$driverDir\Scream.inf"
          $sys = "$driverDir\Scream.sys"
          $cat = "$driverDir\Scream.cat"

          if (!(Test-Path $inf)) {
            throw "No se encontró Scream.inf."
          }

          if (!(Test-Path $sys)) {
            throw "No se encontró Scream.sys."
          }

          if (!(Test-Path $cat)) {
            throw "No se encontró Scream.cat."
          }

          Write-Host "Scream encontrado."

          # --------------------------------------------------------
          # Registrar el certificado del controlador
          # --------------------------------------------------------

          Write-Host "Registrando certificado..."

          $signature = Get-AuthenticodeSignature $sys

          if ($null -ne $signature.SignerCertificate) {

            $cert = $signature.SignerCertificate

            $store = New-Object `
              System.Security.Cryptography.X509Certificates.X509Store(
                "TrustedPublisher",
                "LocalMachine"
              )

            $store.Open(
              [System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite
            )

            try {
              $store.Add($cert)
            }
            finally {
              $store.Close()
            }

            Write-Host "Certificado registrado."
          }
          else {
            Write-Host "El controlador no proporciona certificado legible."
          }

          # --------------------------------------------------------
          # Instalar mediante PnPUtil
          # --------------------------------------------------------

          Write-Host "Instalando controlador mediante PnPUtil..."

          $p = Start-Process `
            -FilePath "$env:SystemRoot\System32\pnputil.exe" `
            -ArgumentList @(
              "/add-driver",
              $inf,
              "/install"
            ) `
            -Wait `
            -PassThru `
            -NoNewWindow

          Write-Host "PnPUtil terminó con código: $($p.ExitCode)"

          if ($p.ExitCode -ne 0) {
            throw "PnPUtil no pudo instalar Scream. Código: $($p.ExitCode)"
          }

          Start-Sleep -Seconds 3

          Write-Host ""
          Write-Host "=========================================="
          Write-Host " SCREAM INSTALADO"
          Write-Host "=========================================="
      # ============================================================
      # 4. INSTALAR SCREAM
      # ============================================================

      - name: Instalar Scream
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " INSTALANDO SCREAM"
          Write-Host "=========================================="

          $root = "$env:RUNNER_TEMP\Scream"

          $inf = Join-Path `
            $root `
            "Install\driver\x64\Scream.inf"

          $cat = Join-Path `
            $root `
            "Install\driver\x64\Scream.cat"

          $devcon = Join-Path `
            $root `
            "Install\helpers\devcon-x64.exe"

          if (!(Test-Path $inf)) {
            throw "No se encontró Scream.inf."
          }

          if (!(Test-Path $cat)) {
            throw "No se encontró Scream.cat."
          }

          if (!(Test-Path $devcon)) {
            throw "No se encontró devcon-x64.exe."
          }

          Write-Host "Importando certificado de Scream..."

          Import-Certificate `
            -FilePath $cat `
            -CertStoreLocation "Cert:\LocalMachine\TrustedPublisher" `
            -ErrorAction SilentlyContinue

          Write-Host "Instalando controlador Scream..."

          & $devcon install $inf "*Scream"

          Start-Sleep -Seconds 3

          Write-Host "Scream instalado."

      # ============================================================
      # 5. INSTALAR PYTHON
      # ============================================================

      - name: Preparar Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=========================================="
          Write-Host " PREPARANDO PYTHON"
          Write-Host "=========================================="

          $python = Get-Command python.exe -ErrorAction SilentlyContinue

          if ($null -eq $python) {

            Write-Host "Python no está disponible."
            Write-Host "Instalando Python 3.12..."

            winget install `
              --id Python.Python.3.12 `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements
          }

          $paths = @(
            "$env:LocalAppData\Programs\Python\Python312",
            "$env:LocalAppData\Programs\Python\Python312\Scripts",
            "C:\Program Files\Python312",
            "C:\Program Files\Python312\Scripts"
          )

          foreach ($p in $paths) {
            if (Test-Path $p) {
              $env:Path += ";$p"
            }
          }

          $pythonPath = (Get-Command python.exe -ErrorAction SilentlyContinue)

          if ($null -eq $pythonPath) {
            throw "Python no pudo instalarse."
          }

          python --version

          python -m pip install --upgrade pip

      # ============================================================
      # 6. INSTALAR WEBSOCKIFY
      # ============================================================

      - name: Instalar websockify
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " INSTALANDO WEBSOCKIFY"
          Write-Host "=========================================="

          python -m pip install websockify

          python -m websockify --help

          Write-Host "websockify instalado."

      # ============================================================
      # 7. DESCARGAR ULTRAVNC 1.8.3.0 X64
      # ============================================================

      - name: Descargar UltraVNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " DESCARGANDO ULTRAVNC 1.8.3.0"
          Write-Host "=========================================="

          $installer = "$env:TEMP\UltraVNC_1830_X64_Setup.exe"

          Invoke-WebRequest `
            -Uri "https://uvnc.eu/download/1800/UltraVNC_1830_X64_Setup.exe" `
            -OutFile $installer `
            -UseBasicParsing

          if (!(Test-Path $installer)) {
            throw "No se pudo descargar UltraVNC."
          }

          Write-Host "UltraVNC descargado."

      # ============================================================
      # 8. INSTALAR ULTRAVNC
      # ============================================================

      - name: Instalar UltraVNC
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=========================================="
          Write-Host " INSTALANDO ULTRAVNC"
          Write-Host "=========================================="

          $installer = "$env:TEMP\UltraVNC_1830_X64_Setup.exe"

          $p = Start-Process `
            -FilePath $installer `
            -ArgumentList "/verysilent", "/norestart" `
            -Wait `
            -PassThru

          Write-Host "Código de instalación: $($p.ExitCode)"

          Start-Sleep -Seconds 3

          Write-Host "UltraVNC instalado."

      # ============================================================
      # 9. LOCALIZAR WINVNC.EXE
      # ============================================================

      - name: Localizar UltraVNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " BUSCANDO WINVNC"
          Write-Host "=========================================="

          $locations = @(
            "C:\Program Files\uvnc bvba\UltraVNC\winvnc.exe",
            "C:\Program Files\UltraVNC\winvnc.exe",
            "C:\Program Files (x86)\uvnc bvba\UltraVNC\winvnc.exe",
            "C:\Program Files (x86)\UltraVNC\winvnc.exe"
          )

          $winvnc = $null

          foreach ($path in $locations) {

            if (Test-Path $path) {
              $winvnc = $path
              break
            }
          }

          if ($null -eq $winvnc) {

            $found = Get-ChildItem `
              -Path "C:\Program Files","C:\Program Files (x86)" `
              -Filter "winvnc.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $winvnc = $found.FullName
            }
          }

          if ($null -eq $winvnc) {
            throw "No se encontró winvnc.exe."
          }

          Write-Host "winvnc encontrado:"
          Write-Host $winvnc

          "WINVNC_PATH=$winvnc" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

      # ============================================================
      # 10. PREPARAR ULTRAVNC.INI
      # ============================================================

      - name: Preparar configuración UltraVNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " PREPARANDO ULTRAVNC.INI"
          Write-Host "=========================================="

          $uvncDir = "C:\ProgramData\UltraVNC"

          New-Item `
            -ItemType Directory `
            -Path $uvncDir `
            -Force | Out-Null

          $ini = Join-Path `
            $uvncDir `
            "ultravnc.ini"

          if (!(Test-Path $ini)) {

            @"
          [ultravnc]
          port=5900
          httpport=5800
          viewonly=0
          alloweditclients=1
          allowshutdown=0
          alloweditsettings=0
          authrequired=1
          AllowLoopback=1
          LoopbackOnly=0
          FileTransferEnabled=1
          BlankMonitorEnabled=0
          BlankInputsOnly=0
          autoreconnect=0
          "@ | Out-File `
              -FilePath $ini `
              -Encoding ascii `
              -Force
          }

          Write-Host "ultravnc.ini preparado:"
          Write-Host $ini

      # ============================================================
      # 11. GENERAR LA CONTRASEÑA REAL DE ULTRAVNC
      # ============================================================

      - name: Generar contraseña UltraVNC
        shell: pwsh
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " GENERANDO CONTRASEÑA ULTRAVNC"
          Write-Host "=========================================="

          $uvncDir = "C:\ProgramData\UltraVNC"
          $password = "12345678"

          $pwdZip = "$env:TEMP\createpassword.zip"
          $pwdDir = "$env:TEMP\createpassword"

          Invoke-WebRequest `
            -Uri "https://uvnc.eu/download/133/createpassword.zip" `
            -OutFile $pwdZip `
            -UseBasicParsing

          if (Test-Path $pwdDir) {
            Remove-Item `
              $pwdDir `
              -Recurse `
              -Force
          }

          Expand-Archive `
            -Path $pwdZip `
            -DestinationPath $pwdDir `
            -Force

          Write-Host "Buscando createpassword64.exe..."

          $createPassword = Get-ChildItem `
            -Path $pwdDir `
            -Filter "createpassword64.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $createPassword) {

            $createPassword = Get-ChildItem `
              -Path $pwdDir `
              -Filter "*64*.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Name -match "createpassword"
              } |
              Select-Object -First 1
          }

          if ($null -eq $createPassword) {
            throw "No se encontró createpassword64.exe."
          }

          Write-Host "Herramienta encontrada:"
          Write-Host $createPassword.FullName

          Push-Location $uvncDir

          # IMPORTANTE:
          # UltraVNC genera aquí el valor cifrado de passwd.
          # NO escribimos 12345678 directamente en ultravnc.ini.
          & $createPassword.FullName $password

          $exitCode = $LASTEXITCODE

          Pop-Location

          if ($exitCode -ne 0) {
            throw "createpassword64 terminó con código $exitCode."
          }

          if (!(Test-Path "$uvncDir\ultravnc.ini")) {
            throw "UltraVNC no creó/modificó ultravnc.ini."
          }

          Write-Host "Contraseña generada correctamente."

          Write-Host "Comprobando que existe passwd..."

          $content = Get-Content `
            "$uvncDir\ultravnc.ini" `
            -Raw

          if ($content -notmatch "(?im)^passwd=") {
            throw "No se encontró passwd= en ultravnc.ini."
          }

          Write-Host "Campo passwd generado por UltraVNC."

      # ============================================================
      # 12. COMPLETAR CONFIGURACIÓN SIN SOBRESCRIBIR PASSWORD
      # ============================================================

      - name: Completar configuración UltraVNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ini = "C:\ProgramData\UltraVNC\ultravnc.ini"

          Write-Host "Completando configuración..."

          $content = Get-Content `
            $ini `
            -Raw

          $settings = @{
            "port" = "5900"
            "httpport" = "5800"
            "viewonly" = "0"
            "alloweditclients" = "1"
            "allowshutdown" = "0"
            "alloweditsettings" = "0"
            "authrequired" = "1"
            "AllowLoopback" = "1"
            "LoopbackOnly" = "0"
            "FileTransferEnabled" = "1"
            "BlankMonitorEnabled" = "0"
            "BlankInputsOnly" = "0"
            "autoreconnect" = "0"
          }

          foreach ($key in $settings.Keys) {

            $value = $settings[$key]

            if ($content -match "(?im)^$([regex]::Escape($key))=") {

              $content = [regex]::Replace(
                $content,
                "(?im)^$([regex]::Escape($key))=.*$",
                "$key=$value"
              )

            }
            else {

              $content += "`r`n$key=$value"
            }
          }

          Set-Content `
            -Path $ini `
            -Value $content `
            -Encoding ascii

          Write-Host "Configuración terminada."

      # ============================================================
      # 13. INICIAR ULTRAVNC
      # ============================================================

      - name: Iniciar UltraVNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " INICIANDO SERVIDOR VNC"
          Write-Host "=========================================="

          $running = Get-Process `
            -Name "winvnc" `
            -ErrorAction SilentlyContinue

          if ($null -ne $running) {
            Stop-Process `
              -Name "winvnc" `
              -Force `
              -ErrorAction SilentlyContinue

            Start-Sleep -Seconds 2
          }

          $process = Start-Process `
            -FilePath $env:WINVNC_PATH `
            -ArgumentList "-run" `
            -PassThru `
            -WindowStyle Hidden

          Start-Sleep -Seconds 5

          if ($process.HasExited) {
            throw "winvnc.exe se cerró."
          }

          Write-Host "UltraVNC iniciado."

      # ============================================================
      # 14. ESPERAR PUERTO 5900
      # ============================================================

      - name: Esperar VNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Esperando puerto VNC 5900..."

          $ready = $false

          for ($i = 0; $i -lt 30; $i++) {

            $test = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 5900 `
              -WarningAction SilentlyContinue

            if ($test.TcpTestSucceeded) {
              $ready = $true
              break
            }

            Start-Sleep -Seconds 2
          }

          if (!$ready) {
            throw "VNC no abrió el puerto 5900."
          }

          Write-Host "Puerto 5900 activo."

      # ============================================================
      # 15. DESCARGAR NOVNC
      # ============================================================

      - name: Descargar noVNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " DESCARGANDO NOVNC"
          Write-Host "=========================================="

          $zip = "$env:TEMP\novnc.zip"
          $extract = "$env:TEMP\novnc_extract"
          $target = "C:\noVNC"

          if (Test-Path $target) {
            Remove-Item `
              $target `
              -Recurse `
              -Force
          }

          if (Test-Path $extract) {
            Remove-Item `
              $extract `
              -Recurse `
              -Force
          }

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/heads/master.zip" `
            -OutFile $zip `
            -UseBasicParsing

          Expand-Archive `
            -Path $zip `
            -DestinationPath $extract `
            -Force

          $source = Get-ChildItem `
            $extract `
            -Directory |
            Select-Object -First 1

          if ($null -eq $source) {
            throw "No se encontró la carpeta de noVNC."
          }

          New-Item `
            -ItemType Directory `
            -Path $target `
            -Force | Out-Null

          Copy-Item `
            "$($source.FullName)\*" `
            $target `
            -Recurse `
            -Force

          Write-Host "noVNC instalado."

      # ============================================================
      # 16. INICIAR NOVNC
      # ============================================================

      - name: Iniciar noVNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " INICIANDO NOVNC"
          Write-Host "=========================================="

          $stdout = "C:\websockify.stdout.log"
          $stderr = "C:\websockify.stderr.log"

          Remove-Item `
            $stdout `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $stderr `
            -Force `
            -ErrorAction SilentlyContinue

          $args = @(
            "-m",
            "websockify",
            "6080",
            "127.0.0.1:5900",
            "--web",
            "C:\noVNC"
          )

          $process = Start-Process `
            -FilePath "python" `
            -ArgumentList $args `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru `
            -WindowStyle Hidden

          Start-Sleep -Seconds 5

          if ($process.HasExited) {

            Write-Host "websockify se cerró."

            if (Test-Path $stdout) {
              Get-Content $stdout
            }

            if (Test-Path $stderr) {
              Get-Content $stderr
            }

            throw "No se pudo iniciar noVNC."
          }

          Write-Host "noVNC iniciado."

      # ============================================================
      # 17. ESPERAR NOVNC
      # ============================================================

      - name: Esperar noVNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Esperando puerto 6080..."

          $ready = $false

          for ($i = 0; $i -lt 30; $i++) {

            $test = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 6080 `
              -WarningAction SilentlyContinue

            if ($test.TcpTestSucceeded) {
              $ready = $true
              break
            }

            Start-Sleep -Seconds 2
          }

          if (!$ready) {

            Write-Host "noVNC no abrió 6080."

            if (Test-Path "C:\websockify.stdout.log") {
              Get-Content "C:\websockify.stdout.log"
            }

            if (Test-Path "C:\websockify.stderr.log") {
              Get-Content "C:\websockify.stderr.log"
            }

            throw "NoVNC no está disponible."
          }

          Write-Host "Puerto 6080 activo."

      # ============================================================
      # 18. DESCARGAR CLOUDFLARED
      # ============================================================

      - name: Instalar Cloudflared
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " INSTALANDO CLOUDFLARED"
          Write-Host "=========================================="

          $cloudflared = "C:\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared `
            -UseBasicParsing

          if (!(Test-Path $cloudflared)) {
            throw "No se pudo descargar cloudflared."
          }

          & $cloudflared --version

          "CLOUDFLARED_PATH=$cloudflared" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

      # ============================================================
      # 19. CREAR URL CLOUDFLARE
      # ============================================================

      - name: Crear URL pública
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " CREANDO URL CLOUDFLARE"
          Write-Host "=========================================="

          $stdout = "C:\cloudflared.stdout.log"
          $stderr = "C:\cloudflared.stderr.log"

          Remove-Item `
            $stdout `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $stderr `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Iniciando Quick Tunnel..."

          $cloudflaredProcess = Start-Process `
            -FilePath $env:CLOUDFLARED_PATH `
            -ArgumentList @(
              "tunnel",
              "--no-autoupdate",
              "--protocol",
              "http2",
              "--url",
              "http://127.0.0.1:6080"
            ) `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru `
            -WindowStyle Hidden

          $url = $null

          for ($i = 0; $i -lt 60; $i++) {

            Start-Sleep -Seconds 2

            $allText = ""

            if (Test-Path $stdout) {
              $allText += Get-Content `
                $stdout `
                -Raw `
                -ErrorAction SilentlyContinue
            }

            if (Test-Path $stderr) {
              $allText += "`r`n"
              $allText += Get-Content `
                $stderr `
                -Raw `
                -ErrorAction SilentlyContinue
            }

            if ($allText) {

              $match = [regex]::Match(
                $allText,
                'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
              )

              if ($match.Success) {
                $url = $match.Value
                break
              }
            }

            if ($cloudflaredProcess.HasExited) {

              Write-Host "Cloudflared se cerró."

              if (Test-Path $stdout) {
                Get-Content $stdout
              }

              if (Test-Path $stderr) {
                Get-Content $stderr
              }

              throw "Cloudflared terminó antes de crear el túnel."
            }
          }

          if ($null -eq $url) {

            Write-Host "No se obtuvo la URL."

            if (Test-Path $stdout) {
              Get-Content $stdout
            }

            if (Test-Path $stderr) {
              Get-Content $stderr
            }

            throw "No se pudo crear el Quick Tunnel."
          }

          "CLOUD_PC_URL=$url" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append `
            -Encoding utf8

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "       CLOUD PC LISTO"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "URL:"
          Write-Host $url
          Write-Host ""
          Write-Host "CONTRASEÑA VNC:"
          Write-Host "12345678"
          Write-Host ""
          Write-Host "=========================================="

      # ============================================================
      # 20. MANTENER TODO ACTIVO
      # ============================================================

      - name: Mantener Cloud PC activo
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host " CLOUD PC ACTIVO"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "URL:"
          Write-Host $env:CLOUD_PC_URL
          Write-Host ""
          Write-Host "Contraseña VNC: 12345678"
          Write-Host ""

          while ($true) {

            $cloudflared = Get-Process `
              -Name "cloudflared" `
              -ErrorAction SilentlyContinue

            $winvnc = Get-Process `
              -Name "winvnc" `
              -ErrorAction SilentlyContinue

            $python = Get-Process `
              -Name "python" `
              -ErrorAction SilentlyContinue

            if ($null -eq $cloudflared) {
              Write-Host "Cloudflared terminó."
              break
            }

            if ($null -eq $winvnc) {
              Write-Host "UltraVNC terminó."
              break
            }

            if ($null -eq $python) {
              Write-Host "websockify terminó."
              break
            }

            Start-Sleep -Seconds 30
          }
