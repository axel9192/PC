name: Windows Cloud PC

on:
  workflow_dispatch:

jobs:
  cloud-pc:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:

      - name: Instalar UltraVNC
        shell: pwsh
        run: |
          $url = "https://uvnc.eu/download/1800/UltraVNC_1830_X64_Setup.exe"
          $exe = "$env:TEMP\UltraVNC.exe"

          Invoke-WebRequest $url -OutFile $exe

          Start-Process $exe `
            -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" `
            -Wait

      - name: Configurar UltraVNC
        shell: pwsh
        run: |
          $vnc = Get-ChildItem `
            "C:\Program Files","C:\Program Files (x86)" `
            -Filter winvnc.exe `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$vnc) {
            throw "No se encontró winvnc.exe"
          }

          $dir = $vnc.DirectoryName
          $ini = "$env:ProgramData\UltraVNC"

          New-Item $ini -ItemType Directory -Force | Out-Null

          Copy-Item "$dir\ultravnc.ini" `
            "$ini\ultravnc.ini" `
            -ErrorAction SilentlyContinue

          $cp = "$env:TEMP\createpassword.zip"

          Invoke-WebRequest `
            "https://uvnc.eu/download/133/createpassword.zip" `
            -OutFile $cp

          Expand-Archive `
            $cp `
            "$env:TEMP\createpassword" `
            -Force

          $tool = Get-ChildItem `
            "$env:TEMP\createpassword" `
            -Filter "createpassword64.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($tool) {
            Push-Location $ini
            & $tool.FullName 12345678
            Pop-Location
          }

          Start-Process $vnc.FullName

          Start-Sleep 5

      - name: Instalar Scream
        shell: pwsh
        continue-on-error: true
        run: |
          $zip = "$env:TEMP\Scream.zip"

          Invoke-WebRequest `
            "https://github.com/duncanthrax/scream/releases/download/4.0/Scream-4.0.zip" `
            -OutFile $zip

          Expand-Archive `
            $zip `
            "C:\Scream" `
            -Force

          $inf = Get-ChildItem `
            "C:\Scream" `
            -Filter Scream.inf `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($inf) {
            pnputil /add-driver $inf.FullName /install
          }

      - name: Instalar Websockify
        shell: pwsh
        run: |
          python -m pip install websockify

      - name: Iniciar noVNC de UltraVNC
        shell: pwsh
        run: |
          $vnc = Get-ChildItem `
            "C:\Program Files","C:\Program Files (x86)" `
            -Filter winvnc.exe `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (!$vnc) {
            throw "No se encontró winvnc.exe"
          }

          $web = Get-ChildItem `
            $vnc.DirectoryName `
            -Recurse `
            -Include "vnc.html","novnc_proxy.exe" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($web) {
            Write-Host "Componente web de UltraVNC encontrado."
          }

          Start-Process `
            python `
            -ArgumentList @(
              "-m",
              "websockify",
              "6080",
              "127.0.0.1:5900",
              "--web",
              $vnc.DirectoryName
            )

          Start-Sleep 5

      - name: Iniciar Cloudflare
        shell: pwsh
        run: |
          $cf = "C:\cloudflared.exe"

          Invoke-WebRequest `
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cf

          & $cf tunnel `
            --protocol http2 `
            --url http://127.0.0.1:6080
