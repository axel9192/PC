name: Windows Cloud PC - Scream + UltraVNC + noVNC + Cloudflare

on:
  workflow_dispatch:

jobs:
  cloud-pc:
    name: Iniciando Cloud PC
    runs-on: windows-2025
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. AUDIO DE WINDOWS
      # ============================================================

      - name: Iniciar servicios de audio
        shell: pwsh
        run: |
          Start-Service AudioEndpointBuilder -ErrorAction SilentlyContinue
          Start-Service Audiosrv -ErrorAction SilentlyContinue

          Set-Service AudioEndpointBuilder -StartupType Automatic -ErrorAction SilentlyContinue
          Set-Service Audiosrv -StartupType Automatic -ErrorAction SilentlyContinue


      # ============================================================
      # 2. INSTALAR SCREAM
      # ============================================================

      - name: Descargar Scream
        shell: pwsh
        run: |
          $zip = "C:\Scream3.6.zip"
          $dir = "C:\Scream"

          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue

          Invoke-WebRequest `
            -Uri "https://github.com/duncanthrax/scream/releases/download/3.6/Scream3.6.zip" `
            -OutFile $zip

          Expand-Archive `
            -Path $zip `
            -DestinationPath $dir `
            -Force

          Write-Host "Scream descargado."


      - name: Instalar Scream
        shell: pwsh
        run: |
          $inf = "C:\Scream\Install\driver\Scream.inf"
          $devcon = "C:\Scream\Install\helpers\devcon.exe"

          if (-not (Test-Path $inf)) {
            throw "No existe Scream.inf"
          }

          if (-not (Test-Path $devcon)) {
            throw "No existe devcon.exe"
          }

          $driver = "C:\Scream\Install\driver\Scream.sys"

          if (Test-Path $driver) {
            $cert = (Get-AuthenticodeSignature $driver).SignerCertificate

            if ($null -ne $cert) {
              $store = New-Object `
                System.Security.Cryptography.X509Certificates.X509Store(
                  "TrustedPublisher",
                  "LocalMachine"
                )

              $store.Open(
                [System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite
              )

              try {
                $store.Add($cert)
              }
              catch {
              }

              $store.Close()
            }
          }

          Set-Location "C:\Scream\Install\driver"

          & $devcon install $inf "*Scream"

          if ($LASTEXITCODE -ne 0) {
            throw "La instalación de Scream falló."
          }

          Start-Sleep -Seconds 3

          Start-Service AudioEndpointBuilder -ErrorAction SilentlyContinue
          Start-Service Audiosrv -ErrorAction SilentlyContinue

          Write-Host "Scream instalado correctamente."


      # ============================================================
      # 3. DESCARGAR ULTRAVNC
      # ============================================================

      - name: Descargar UltraVNC
        shell: pwsh
        run: |
          $installer = "C:\UltraVNC_Setup.exe"

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          Invoke-WebRequest `
            -Uri "https://uvnc.eu/download/1800/UltraVNC_1824_x64_Setup.exe" `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            throw "No se pudo descargar UltraVNC."
          }

          Write-Host "UltraVNC descargado."


      # ============================================================
      # 4. INSTALAR ULTRAVNC
      # ============================================================

      - name: Instalar UltraVNC
        shell: pwsh
        run: |
          $installer = "C:\UltraVNC_Setup.exe"

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "La instalación de UltraVNC falló."
          }

          Write-Host "UltraVNC instalado."


      # ============================================================
      # 5. CONFIGURAR ULTRAVNC
      # ============================================================

      - name: Configurar UltraVNC
        shell: pwsh
        run: |
          $paths = @(
            "C:\Program Files\uvnc bvba\UltraVNC",
            "C:\Program Files\UltraVNC"
          )

          $vncDir = $null

          foreach ($path in $paths) {
            if (Test-Path $path) {
              $vncDir = $path
              break
            }
          }

          if ($null -eq $vncDir) {
            throw "No se encontró la carpeta de UltraVNC."
          }

          $winvnc = Join-Path $vncDir "winvnc.exe"
          $ini = Join-Path $vncDir "ultravnc.ini"

          $config = @(
            "[admin]",
            "AllowShutdown=1",
            "AllowProperties=1",
            "AllowEditClients=1",
            "AllowFileTransfer=1",
            "AllowRemoteConfig=1",
            "AllowTcpListen=1",
            "UseVNCAuthentication=1",
            "UseDSMPlugin=0",
            "MSRC4Plugin=0",
            "passwd=0000000000000000",
            "passwd2=0000000000000000",
            "AllowLoopback=1",
            "AllowLoopbackOnly=0"
          )

          $config | Set-Content `
            -Path $ini `
            -Encoding ASCII

          if (-not (Test-Path $winvnc)) {
            throw "No se encontró winvnc.exe."
          }

          Write-Host "UltraVNC configurado."


      # ============================================================
      # 6. ABRIR PUERTO LOCAL DE VNC
      # ============================================================

      - name: Configurar firewall VNC
        shell: pwsh
        run: |
          Remove-NetFirewallRule `
            -DisplayName "UltraVNC 5900" `
            -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "UltraVNC 5900" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 5900 `
            -Action Allow `
            -Profile Any `
            -ErrorAction SilentlyContinue


      # ============================================================
      # 7. INICIAR ULTRAVNC
      # ============================================================

      - name: Iniciar UltraVNC
        shell: pwsh
        run: |
          $vncDirs = @(
            "C:\Program Files\uvnc bvba\UltraVNC",
            "C:\Program Files\UltraVNC"
          )

          $winvnc = $null

          foreach ($dir in $vncDirs) {
            $candidate = Join-Path $dir "winvnc.exe"

            if (Test-Path $candidate) {
              $winvnc = $candidate
              break
            }
          }

          if ($null -eq $winvnc) {
            throw "winvnc.exe no encontrado."
          }

          Get-Process winvnc -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

          Start-Process `
            -FilePath $winvnc `
            -WorkingDirectory (Split-Path $winvnc)

          Start-Sleep -Seconds 5

          Write-Host "UltraVNC iniciado."


      # ============================================================
      # 8. INSTALAR PYTHON + WEBSOCKIFY
      # ============================================================

      - name: Instalar websockify
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install websockify


      # ============================================================
      # 9. DESCARGAR NOVNC
      # ============================================================

      - name: Descargar noVNC
        shell: pwsh
        run: |
          $dir = "C:\noVNC"

          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue

          git clone --depth 1 `
            "https://github.com/novnc/noVNC.git" `
            $dir

          if (-not (Test-Path "$dir\vnc.html")) {
            throw "noVNC no se descargó correctamente."
          }

          Write-Host "noVNC instalado."


      # ============================================================
      # 10. INICIAR WEBSOCKIFY
      # ============================================================

      - name: Iniciar noVNC
        shell: pwsh
        run: |
          $websockify = Get-Command websockify.exe -ErrorAction SilentlyContinue

          if ($null -eq $websockify) {
            $websockify = Get-Command websockify -ErrorAction SilentlyContinue
          }

          if ($null -eq $websockify) {
            throw "websockify no está disponible."
          }

          $arguments = @(
            "6080",
            "127.0.0.1:5900",
            "--web",
            "C:\noVNC"
          )

          Start-Process `
            -FilePath $websockify.Source `
            -ArgumentList $arguments `
            -WorkingDirectory "C:\noVNC"

          Start-Sleep -Seconds 5

          Write-Host "noVNC iniciado en el puerto 6080."

            # ============================================================
      # 11. DESCARGAR CLOUDFLARED
      # ============================================================

      - name: Descargar Cloudflared
        shell: pwsh
        run: |
          $cloudflared = "C:\cloudflared.exe"

          Remove-Item $cloudflared -Force -ErrorAction SilentlyContinue

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared

          if (-not (Test-Path $cloudflared)) {
            throw "No se pudo descargar cloudflared."
          }

          Write-Host "Cloudflared descargado."


      # ============================================================
      # 12. FIREWALL LOCAL
      # ============================================================

      - name: Configurar firewall noVNC
        shell: pwsh
        run: |
          Remove-NetFirewallRule `
            -DisplayName "noVNC 6080" `
            -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "noVNC 6080" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 6080 `
            -Action Allow `
            -Profile Any `
            -ErrorAction SilentlyContinue


      # ============================================================
      # 13. CLOUDFLARED + MANTENERLO VIVO
      # ============================================================

      - name: Iniciar Cloudflare Quick Tunnel
        shell: pwsh
        run: |
          $cloudflared = "C:\cloudflared.exe"
          $stdout = "C:\cloudflared_stdout.txt"
          $stderr = "C:\cloudflared_stderr.txt"

          Remove-Item $stdout -Force -ErrorAction SilentlyContinue
          Remove-Item $stderr -Force -ErrorAction SilentlyContinue

          Write-Host "Iniciando Cloudflare Quick Tunnel..."

          $cloudflaredProcess = Start-Process `
            -FilePath $cloudflared `
            -ArgumentList @(
              "tunnel",
              "--no-autoupdate",
              "--edge-ip-version",
              "4",
              "--protocol",
              "http2",
              "--url",
              "http://127.0.0.1:6080"
            ) `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -WindowStyle Hidden `
            -PassThru

          $tunnelUrl = $null

          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1

            $output = ""

            if (Test-Path $stdout) {
              $output += (Get-Content $stdout -Raw -ErrorAction SilentlyContinue)
            }

            if (Test-Path $stderr) {
              $output += (Get-Content $stderr -Raw -ErrorAction SilentlyContinue)
            }

            $match = [regex]::Match(
              $output,
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
            )

            if ($match.Success) {
              $tunnelUrl = $match.Value
              break
            }

            if ($cloudflaredProcess.HasExited) {
              throw "Cloudflared terminó antes de crear el túnel."
            }
          }

          if ([string]::IsNullOrWhiteSpace($tunnelUrl)) {
            throw "No se obtuvo la URL de Cloudflare."
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "      CLOUD PC LISTO"
          Write-Host "============================================"
          Write-Host ""
          Write-Host "URL noVNC:"
          Write-Host $tunnelUrl
          Write-Host ""
          Write-Host "============================================"
          Write-Host ""

          # Mantener Cloudflared ejecutándose.
          # GitHub Actions permanecerá en este paso mientras
          # el túnel siga activo.

          while (-not $cloudflaredProcess.HasExited) {
            Start-Sleep -Seconds 10
          }

          throw "Cloudflared se detuvo."


      # ============================================================
      # 14. FIN
      # ============================================================

      - name: Finalizar
        if: always()
        shell: pwsh
        run: |
          Write-Host "Workflow finalizado."
