name: Windows Cloud PC - Scream + UltraVNC + noVNC + Cloudflare

on:
  workflow_dispatch:

jobs:
  build:
    name: Iniciando Cloud PC
    runs-on: windows-2025
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. PREPARAR WINDOWS
      # ============================================================

      - name: Preparar Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=========================================="
          Write-Host " PREPARANDO WINDOWS CLOUD PC"
          Write-Host "=========================================="

          Set-ExecutionPolicy Bypass -Scope Process -Force

          Write-Host "Windows preparado."

      # ============================================================
      # 2. INICIAR AUDIO SIN BLOQUEAR EL WORKFLOW
      # ============================================================

      - name: Iniciar servicios de audio
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=========================================="
          Write-Host " INICIANDO AUDIO DE WINDOWS"
          Write-Host "=========================================="

          $services = @(
            "AudioEndpointBuilder",
            "Audiosrv"
          )

          foreach ($name in $services) {

            $svc = Get-Service -Name $name -ErrorAction SilentlyContinue

            if ($null -eq $svc) {
              Write-Host "$name no está disponible."
              continue
            }

            if ($svc.Status -eq "Running") {
              Write-Host "$name ya está iniciado."
              continue
            }

            Write-Host "Intentando iniciar $name..."

            # Ejecutar SC.EXE separado para evitar que
            # Start-Service bloquee indefinidamente.
            $process = Start-Process `
              -FilePath "$env:SystemRoot\System32\sc.exe" `
              -ArgumentList @("start", $name) `
              -PassThru `
              -WindowStyle Hidden

            try {
              Wait-Process -Id $process.Id -Timeout 10 -ErrorAction Stop
              Write-Host "$name: comando de inicio terminado."
            }
            catch {
              Write-Host "$name tardó demasiado. Se continúa sin bloquear el workflow."

              try {
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              }
              catch {}
            }
          }

          Write-Host "Audio: paso terminado."
          Write-Host "Continuando..."

      # ============================================================
      # 3. INSTALAR PYTHON
      # ============================================================

      - name: Preparar Python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Instalando Python..."

          $python = Get-Command python -ErrorAction SilentlyContinue

          if ($null -eq $python) {

            Write-Host "Python no encontrado. Instalando..."

            winget install `
              --id Python.Python.3.12 `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements

          }

          $env:Path += ";$env:LocalAppData\Programs\Python\Python312"
          $env:Path += ";$env:LocalAppData\Programs\Python\Python312\Scripts"

          python --version

          python -m pip install --upgrade pip

      # ============================================================
      # 4. INSTALAR WEBsockify
      # ============================================================

      - name: Instalar websockify
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Instalando websockify..."

          python -m pip install websockify

          python -m websockify --help

      # ============================================================
      # 5. DESCARGAR E INSTALAR ULTRAVNC
      # ============================================================

      - name: Instalar UltraVNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " INSTALANDO ULTRAVNC"
          Write-Host "=========================================="

          $url = "https://uvnc.com/download/UltraVNC_1830_X64_Setup.exe"
          $installer = "$env:TEMP\UltraVNC_Setup.exe"

          Write-Host "Descargando UltraVNC 1.8.3.0..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -UseBasicParsing

          if (!(Test-Path $installer)) {
            throw "No se pudo descargar UltraVNC."
          }

          Write-Host "Instalador descargado."

          $install = Start-Process `
            -FilePath $installer `
            -ArgumentList "/verysilent /norestart" `
            -Wait `
            -PassThru

          Write-Host "Código de instalación: $($install.ExitCode)"

          if ($install.ExitCode -ne 0 -and $install.ExitCode -ne 3010) {
            throw "UltraVNC no pudo instalarse."
          }

          Write-Host "UltraVNC instalado."

      # ============================================================
      # 6. LOCALIZAR WINVNC
      # ============================================================

      - name: Preparar servidor VNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Buscando winvnc.exe..."

          $possible = @(
            "C:\Program Files\uvnc bvba\UltraVNC\winvnc.exe",
            "C:\Program Files\UltraVNC\winvnc.exe",
            "C:\Program Files (x86)\uvnc bvba\UltraVNC\winvnc.exe",
            "C:\Program Files (x86)\UltraVNC\winvnc.exe"
          )

          $winvnc = $null

          foreach ($path in $possible) {
            if (Test-Path $path) {
              $winvnc = $path
              break
            }
          }

          if ($null -eq $winvnc) {

            $found = Get-ChildItem `
              -Path "C:\Program Files","C:\Program Files (x86)" `
              -Filter "winvnc.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($found) {
              $winvnc = $found.FullName
            }
          }

          if ($null -eq $winvnc) {
            throw "No se encontró winvnc.exe."
          }

          Write-Host "UltraVNC encontrado:"
          Write-Host $winvnc

          "WINVNC_PATH=$winvnc" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

      # ============================================================
      # 7. CONFIGURAR ULTRAVNC
      # ============================================================

      - name: Configurar UltraVNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " CONFIGURANDO ULTRAVNC"
          Write-Host "=========================================="

          $programData = "C:\ProgramData\UltraVNC"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $programData | Out-Null

          $ini = @"
          [ultravnc]
          passwd=12345678
          passwd2=
          viewonly=0
          viewonly_passwd=
          alloweditclients=1
          allowshutdown=0
          alloweditsettings=0
          authrequired=1
          AllowLoopback=1
          LoopbackOnly=0
          DSMPlugin=
          AuthHosts=
          AllowShutdown=0
          AllowProperties=0
          AllowEditClients=1
          FileTransferEnabled=1
          BlankMonitorEnabled=0
          BlankInputsOnly=0
          DefaultScale=1
          mslogon=0
          service_commandline=
          port=5900
          httpport=5800
          autoreconnect=0
          accept_reject=0
          accept_reject_timeout=10
          [admin]
          use_vnc_auth=1
          [poll]
          PollUnderCursor=0
          PollForeground=0
          PollFullScreen=1
          PollConsoleOnly=0
          PollOnEventOnly=0
          MaxCpu=50
          MaxFPS=25
          [Permissions]
          AllowProperties=0
          AllowEditClients=1
          AllowShutdown=0
          AllowEditSettings=0
          FileTransferEnabled=1
          "@

          $iniPath = Join-Path $programData "ultravnc.ini"

          $ini | Out-File `
            -FilePath $iniPath `
            -Encoding ascii `
            -Force

          Write-Host "Configuración creada:"
          Write-Host $iniPath

      # ============================================================
      # 8. INICIAR ULTRAVNC
      # ============================================================

      - name: Iniciar servidor VNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " INICIANDO SERVIDOR VNC"
          Write-Host "=========================================="

          $process = Start-Process `
            -FilePath $env:WINVNC_PATH `
            -ArgumentList "-run" `
            -PassThru `
            -WindowStyle Hidden

          Start-Sleep -Seconds 5

          if ($process.HasExited) {
            throw "winvnc.exe se cerró inmediatamente."
          }

          Write-Host "UltraVNC está ejecutándose."

      # ============================================================
      # 9. COMPROBAR PUERTO VNC
      # ============================================================

      - name: Esperar puerto VNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Esperando VNC en 127.0.0.1:5900..."

          $ok = $false

          for ($i = 0; $i -lt 30; $i++) {

            $connection = Test-NetConnection `
              -ComputerName 127.0.0.1 `
              -Port 5900 `
              -WarningAction SilentlyContinue

            if ($connection.TcpTestSucceeded) {
              $ok = $true
              break
            }

            Start-Sleep -Seconds 2
          }

          if (!$ok) {
            throw "VNC no abrió el puerto 5900."
          }

          Write-Host "Puerto VNC 5900 activo."

      # ============================================================
      # 10. DESCARGAR NOVNC
      # ============================================================

      - name: Descargar noVNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " INSTALANDO NOVNC"
          Write-Host "=========================================="

          $zip = "$env:TEMP\novnc.zip"
          $folder = "C:\noVNC"

          if (Test-Path $folder) {
            Remove-Item $folder -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $folder `
            -Force | Out-Null

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/heads/master.zip" `
            -OutFile $zip `
            -UseBasicParsing

          Expand-Archive `
            -Path $zip `
            -DestinationPath "$env:TEMP\novnc_extract" `
            -Force

          $source = Get-ChildItem `
            "$env:TEMP\novnc_extract" `
            -Directory |
            Select-Object -First 1

          Copy-Item `
            "$($source.FullName)\*" `
            $folder `
            -Recurse `
            -Force

          Write-Host "noVNC instalado en $folder"

      # ============================================================
      # 11. INICIAR WEBSOCKIFY + NOVNC
      # ============================================================

      - name: Iniciar noVNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " INICIANDO NOVNC"
          Write-Host "=========================================="

          $log = "C:\websockify.log"

          if (Test-Path $log) {
            Remove-Item $log -Force
          }

          $args = @(
            "-m",
            "websockify",
            "6080",
            "127.0.0.1:5900",
            "--web",
            "C:\noVNC"
          )

          $process = Start-Process `
            -FilePath "python" `
            -ArgumentList $args `
            -RedirectStandardOutput $log `
            -RedirectStandardError $log `
            -PassThru `
            -WindowStyle Hidden

          Start-Sleep -Seconds 5

          if ($process.HasExited) {
            Write-Host "websockify terminó inesperadamente."
            if (Test-Path $log) {
              Get-Content $log
            }
            throw "No se pudo iniciar noVNC."
          }

          Write-Host "noVNC está ejecutándose en puerto 6080."

      # ============================================================
      # 12. COMPROBAR NOVNC
      # ============================================================

      - name: Esperar noVNC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Esperando noVNC en 127.0.0.1:6080..."

          $ok = $false

          for ($i = 0; $i -lt 30; $i++) {

            $connection = Test-NetConnection `
              -ComputerName 127.0.0.1 `
              -Port 6080 `
              -WarningAction SilentlyContinue

            if ($connection.TcpTestSucceeded) {
              $ok = $true
              break
            }

            Start-Sleep -Seconds 2
          }

          if (!$ok) {
            throw "noVNC no abrió el puerto 6080."
          }

          Write-Host "noVNC está listo."

      # ============================================================
      # 13. INSTALAR CLOUDFLARED
      # ============================================================

      - name: Instalar Cloudflared
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " INSTALANDO CLOUDFLARED"
          Write-Host "=========================================="

          $cloudflared = "C:\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared `
            -UseBasicParsing

          if (!(Test-Path $cloudflared)) {
            throw "No se pudo descargar cloudflared."
          }

          & $cloudflared --version

          "CLOUDFLARED_PATH=$cloudflared" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

      # ============================================================
      # 14. INICIAR CLOUDFLARE QUICK TUNNEL
      # ============================================================

      - name: Crear URL pública
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host " CREANDO URL PÚBLICA"
          Write-Host "=========================================="

          $log = "C:\cloudflared.log"

          if (Test-Path $log) {
            Remove-Item $log -Force
          }

          Write-Host "Iniciando Cloudflare Quick Tunnel..."

          $process = Start-Process `
            -FilePath $env:CLOUDFLARED_PATH `
            -ArgumentList @(
              "tunnel",
              "--no-autoupdate",
              "--protocol",
              "http2",
              "--url",
              "http://127.0.0.1:6080"
            ) `
            -RedirectStandardOutput $log `
            -RedirectStandardError $log `
            -PassThru `
            -WindowStyle Hidden

          $url = $null

          for ($i = 0; $i -lt 60; $i++) {

            Start-Sleep -Seconds 2

            if (Test-Path $log) {

              $content = Get-Content $log -Raw -ErrorAction SilentlyContinue

              if ($content) {

                $match = [regex]::Match(
                  $content,
                  'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
                )

                if ($match.Success) {
                  $url = $match.Value
                  break
                }
              }
            }

            if ($process.HasExited) {
              Write-Host "Cloudflared terminó antes de crear la URL."
              if (Test-Path $log) {
                Get-Content $log
              }
              throw "Cloudflared no pudo crear el túnel."
            }
          }

          if ($null -eq $url) {
            Write-Host "Cloudflared no generó una URL dentro del tiempo esperado."

            if (Test-Path $log) {
              Get-Content $log
            }

            throw "No se obtuvo la URL de Cloudflare."
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "       CLOUD PC LISTO"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "URL:"
          Write-Host $url
          Write-Host ""
          Write-Host "Usuario: no aplica"
          Write-Host "Contraseña VNC: 12345678"
          Write-Host ""
          Write-Host "Abre la URL en el navegador."
          Write-Host "=========================================="

          "CLOUD_PC_URL=$url" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

      # ============================================================
      # 15. MANTENER CLOUD PC ENCENDIDO
      # ============================================================

      - name: Mantener Cloud PC activo
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host " CLOUD PC ACTIVO"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "URL:"
          Write-Host $env:CLOUD_PC_URL
          Write-Host ""
          Write-Host "VNC:"
          Write-Host "12345678"
          Write-Host ""
          Write-Host "El equipo permanecerá activo mientras"
          Write-Host "Cloudflare siga conectado."
          Write-Host ""

          while ($true) {

            $cloudflared = Get-Process `
              -Name "cloudflared" `
              -ErrorAction SilentlyContinue

            $winvnc = Get-Process `
              -Name "winvnc" `
              -ErrorAction SilentlyContinue

            $python = Get-Process `
              -Name "python" `
              -ErrorAction SilentlyContinue

            if ($null -eq $cloudflared) {
              Write-Host "Cloudflared terminó."
              break
            }

            if ($null -eq $winvnc) {
              Write-Host "UltraVNC terminó."
              break
            }

            if ($null -eq $python) {
              Write-Host "Python/websockify terminó."
              break
            }

            Start-Sleep -Seconds 30
          }
