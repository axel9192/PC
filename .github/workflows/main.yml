name: Windows Cloud PC

on:
  workflow_dispatch:

jobs:
  cloud-pc:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Preparar Windows
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "        WINDOWS CLOUD PC"
          Write-Host "========================================"

          $theme = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

          New-Item -Path $theme -Force | Out-Null
          Set-ItemProperty -Path $theme -Name "AppsUseLightTheme" -Value 0
          Set-ItemProperty -Path $theme -Name "SystemUsesLightTheme" -Value 0

          Write-Host "[OK] Tema oscuro activado."

      - name: Instalar UltraVNC
        shell: pwsh
        run: |
          Write-Host "[1/5] Descargando UltraVNC..."

          $zip = "$env:TEMP\UltraVNC.zip"

          Invoke-WebRequest `
            -Uri "https://uvnc.eu/download/1800/UltraVNC_1830.zip" `
            -OutFile $zip

          New-Item `
            -ItemType Directory `
            -Path "C:\UltraVNC" `
            -Force | Out-Null

          Expand-Archive `
            -Path $zip `
            -DestinationPath "C:\UltraVNC" `
            -Force

          $vnc = Get-ChildItem `
            -Path "C:\UltraVNC" `
            -Filter "winvnc.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $vnc) {
            throw "No se encontró winvnc.exe."
          }

          Write-Host "[OK] UltraVNC encontrado."
          Write-Host $vnc.FullName

      - name: Configurar contraseña VNC
        shell: pwsh
        run: |
          Write-Host "[2/5] Configurando contraseña..."

          $passwordZip = "$env:TEMP\createpassword.zip"
          $passwordDir = "$env:TEMP\createpassword"

          Invoke-WebRequest `
            -Uri "https://uvnc.eu/download/133/createpassword.zip" `
            -OutFile $passwordZip

          New-Item `
            -ItemType Directory `
            -Path $passwordDir `
            -Force | Out-Null

          Expand-Archive `
            -Path $passwordZip `
            -DestinationPath $passwordDir `
            -Force

          $cp = Get-ChildItem `
            -Path $passwordDir `
            -Filter "createpassword64.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $cp) {
            throw "No se encontró createpassword64.exe."
          }

          $vnc = Get-ChildItem `
            -Path "C:\UltraVNC" `
            -Filter "winvnc.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $dir = $vnc.DirectoryName

          Push-Location $dir

          & $cp.FullName secure 1
          & $cp.FullName secure 12345678

          Pop-Location

          Write-Host "[OK] Contraseña VNC configurada."
          Write-Host "[OK] Contraseña: 12345678"

      - name: Configurar y arrancar UltraVNC
        shell: pwsh
        run: |
          Write-Host "[3/5] Configurando servidor VNC..."

          $vnc = Get-ChildItem `
            -Path "C:\UltraVNC" `
            -Filter "winvnc.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $vnc) {
            throw "No se encontró WinVNC."
          }

          $dir = $vnc.DirectoryName
          $ini = Join-Path $dir "ultravnc.ini"

          $config = @"
[ultravnc]
SocketConnect=1
PortNumber=5900
AutoPortSelect=0
InputsEnabled=1
AllowLoopback=1
LoopbackOnly=0
IdleTimeout=0
IdleInputTimeout=0
"@

          Set-Content `
            -Path $ini `
            -Value $config `
            -Encoding ASCII

          Write-Host "[OK] Puerto VNC: 5900"

          Start-Process `
            -FilePath $vnc.FullName `
            -WorkingDirectory $dir

          Start-Sleep -Seconds 5

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 5900 `
            -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
            throw "UltraVNC no está escuchando en el puerto 5900."
          }

          Write-Host "[OK] UltraVNC funcionando."

      - name: Instalar noVNC y Websockify
        shell: pwsh
        run: |
          Write-Host "[4/5] Instalando noVNC..."

          $novncZip = "$env:TEMP\novnc.zip"
          $websockifyZip = "$env:TEMP\websockify.zip"

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.7.0.zip" `
            -OutFile $novncZip

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/websockify/archive/refs/tags/v0.13.0.zip" `
            -OutFile $websockifyZip

          Expand-Archive `
            -Path $novncZip `
            -DestinationPath "C:\noVNC" `
            -Force

          Expand-Archive `
            -Path $websockifyZip `
            -DestinationPath "C:\Websockify" `
            -Force

          $novnc = Get-ChildItem `
            -Path "C:\noVNC" `
            -Directory |
            Select-Object -First 1

          $websockify = Get-ChildItem `
            -Path "C:\Websockify" `
            -Directory |
            Select-Object -First 1

          if ($null -eq $novnc) {
            throw "No se encontró noVNC."
          }

          if ($null -eq $websockify) {
            throw "No se encontró Websockify."
          }

          Write-Host "[OK] noVNC instalado."
          Write-Host "[OK] Websockify instalado."

          Write-Host "[...] Iniciando Websockify..."

          Start-Process `
            -FilePath "python" `
            -ArgumentList @(
              "-m",
              "websockify",
              "6080",
              "127.0.0.1:5900",
              "--web",
              $novnc.FullName
            ) `
            -WorkingDirectory $websockify.FullName

          Start-Sleep -Seconds 5

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 6080 `
            -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
            throw "Websockify no abrió el puerto 6080."
          }

          Write-Host "[OK] noVNC funcionando en puerto 6080."

      - name: Cloudflare
        shell: pwsh
        run: |
          Write-Host "[5/5] Iniciando Cloudflare..."
          Write-Host ""
          Write-Host "========================================"
          Write-Host "          CLOUD PC LISTO"
          Write-Host "========================================"
          Write-Host ""

          $cloudflared = "C:\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared

          Write-Host "[OK] Cloudflared descargado."
          Write-Host ""
          Write-Host "TU URL APARECERÁ ABAJO:"
          Write-Host ""

          & $cloudflared tunnel `
            --no-autoupdate `
            --protocol http2 `
            --url "http://127.0.0.1:6080"

      - name: Mantener PC activa
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "       CLOUD PC EN EJECUCION"
          Write-Host "========================================"

          while ($true) {
            Write-Host "PC activa - $(Get-Date -Format 'HH:mm:ss')"
            Start-Sleep -Seconds 60
          }
