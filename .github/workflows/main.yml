name: Windows Cloud PC

on:
  workflow_dispatch:

jobs:
  cloud-pc:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:

      - name: Preparar Windows
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "        WINDOWS CLOUD PC"
          Write-Host "========================================"

          $theme = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

          New-Item -Path $theme -Force | Out-Null
          Set-ItemProperty -Path $theme -Name "AppsUseLightTheme" -Value 0
          Set-ItemProperty -Path $theme -Name "SystemUsesLightTheme" -Value 0

          Write-Host "[OK] Tema oscuro activado."

      - name: Instalar TightVNC
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[1/4] Descargando TightVNC..."

          $installer = "$env:TEMP\tightvnc.msi"

          Invoke-WebRequest `
            -Uri "https://www.tightvnc.com/download/2.8.90/tightvnc-2.8.90-setup-64bit.msi" `
            -OutFile $installer

          Write-Host "[OK] Instalador descargado."

          Write-Host "[...] Instalando TightVNC..."

          $arguments = @(
            "/i"
            "`"$installer`""
            "/quiet"
            "/norestart"
            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"
            "SET_PASSWORD=1"
            "VALUE_OF_PASSWORD=12345678"
            "SET_VIEWONLYPASSWORD=1"
            "VALUE_OF_VIEWONLYPASSWORD=12345678"
          )

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "La instalación de TightVNC falló. Código: $($process.ExitCode)"
          }

          Write-Host "[OK] TightVNC instalado."
          Write-Host "[OK] Contraseña VNC: 12345678"

      - name: Iniciar TightVNC
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[2/4] Iniciando TightVNC..."

          $server = Get-ChildItem `
            -Path "C:\Program Files" `
            -Filter "tvnserver.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $server) {
            throw "No se encontró tvnserver.exe."
          }

          Write-Host "[OK] Servidor encontrado:"
          Write-Host $server.FullName

          & $server.FullName -start

          Start-Sleep -Seconds 5

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 5900 `
            -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
            throw "TightVNC no está escuchando en el puerto 5900."
          }

          Write-Host "[OK] TightVNC está activo en 5900."

      - name: Instalar noVNC y Websockify
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[3/4] Instalando noVNC + Websockify..."

          $novncZip = "$env:TEMP\novnc.zip"
          $websockifyZip = "$env:TEMP\websockify.zip"

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.7.0.zip" `
            -OutFile $novncZip

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/websockify/archive/refs/tags/v0.13.0.zip" `
            -OutFile $websockifyZip

          Expand-Archive `
            -Path $novncZip `
            -DestinationPath "C:\noVNC" `
            -Force

          Expand-Archive `
            -Path $websockifyZip `
            -DestinationPath "C:\Websockify" `
            -Force

          $novnc = Get-ChildItem `
            -Path "C:\noVNC" `
            -Directory |
            Select-Object -First 1

          $websockify = Get-ChildItem `
            -Path "C:\Websockify" `
            -Directory |
            Select-Object -First 1

          if ($null -eq $novnc) {
            throw "No se encontró noVNC."
          }

          if ($null -eq $websockify) {
            throw "No se encontró Websockify."
          }

          Write-Host "[OK] noVNC encontrado."
          Write-Host "[OK] Websockify encontrado."

          Write-Host "[...] Iniciando Websockify..."

          Start-Process `
            -FilePath "python" `
            -ArgumentList @(
              "-m"
              "websockify"
              "6080"
              "127.0.0.1:5900"
              "--web"
              $novnc.FullName
            ) `
            -WorkingDirectory $websockify.FullName

          Start-Sleep -Seconds 5

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 6080 `
            -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
            throw "Websockify no abrió el puerto 6080."
          }

          Write-Host "[OK] noVNC funcionando en 6080."

      - name: Iniciar Cloudflare
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[4/4] Iniciando Cloudflare..."
          Write-Host ""
          Write-Host "========================================"
          Write-Host "          CLOUD PC LISTO"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "La URL aparecerá debajo:"
          Write-Host ""

          $cloudflared = "C:\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared

          Write-Host "[OK] Cloudflared descargado."
          Write-Host ""

          & $cloudflared tunnel `
            --no-autoupdate `
            --protocol http2 `
            --url "http://127.0.0.1:6080"

      - name: Mantener PC activa
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "       CLOUD PC EN EJECUCION"
          Write-Host "========================================"

          while ($true) {
            Write-Host "PC activa - $(Get-Date -Format 'HH:mm:ss')"
            Start-Sleep -Seconds 60
          }
