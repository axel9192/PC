name: Windows Cloud PC - TightVNC + noVNC

on:
  workflow_dispatch:

jobs:
  cloud-pc:

    name: Windows Cloud PC
    runs-on: windows-2025
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. WINDOWS DARK MODE
      # ============================================================

      - name: Configurar Windows
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "       WINDOWS CLOUD PC"
          Write-Host "========================================"

          $theme = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

          New-Item -Path $theme -Force | Out-Null

          Set-ItemProperty `
            -Path $theme `
            -Name "AppsUseLightTheme" `
            -Value 0

          Set-ItemProperty `
            -Path $theme `
            -Name "SystemUsesLightTheme" `
            -Value 0

          Write-Host "[OK] Modo oscuro activado."


      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # 3. TIGHTVNC
      # ============================================================

      - name: Instalar TightVNC
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "[1/5] Instalando TightVNC..."

          $installer = "$env:TEMP\tightvnc.msi"

          $url = "https://www.tightvnc.com/download/2.8.90/tightvnc-2.8.90-gpl-setup-64bit.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          if (!(Test-Path $installer)) {
            throw "No se pudo descargar TightVNC."
          }

          $size = (Get-Item $installer).Length

          Write-Host "[OK] Instalador descargado."
          Write-Host "[OK] Tamaño: $size bytes"

          if ($size -lt 1000000) {
            throw "El archivo descargado no parece ser el instalador correcto."
          }

          $arguments = @(
            "/i"
            "`"$installer`""
            "/quiet"
            "/norestart"

            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"

            "SET_PASSWORD=1"
            "VALUE_OF_PASSWORD=12345678"

            "SET_VIEWONLYPASSWORD=1"
            "VALUE_OF_VIEWONLYPASSWORD=12345678"
          )

          $p = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          if ($p.ExitCode -ne 0) {
            throw "La instalación de TightVNC falló. Código: $($p.ExitCode)"
          }

          Write-Host "[OK] TightVNC instalado."


      # ============================================================
      # 4. INICIAR TIGHTVNC
      # ============================================================

      - name: Iniciar TightVNC
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "[2/5] Iniciando servidor VNC..."

          $tvn = "C:\Program Files\TightVNC\tvnserver.exe"

          if (!(Test-Path $tvn)) {
            throw "No existe $tvn"
          }

          Write-Host "[OK] tvnserver.exe encontrado."

          & $tvn -install -silent

          Start-Sleep -Seconds 3

          & $tvn -start -silent

          Start-Sleep -Seconds 5

          $check = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 5900 `
            -WarningAction SilentlyContinue

          if (!$check.TcpTestSucceeded) {
            throw "TightVNC no está escuchando en el puerto 5900."
          }

          Write-Host "[OK] TightVNC está escuchando en 5900."


      # ============================================================
      # 5. DESCARGAR NOVNC
      # ============================================================

      - name: Descargar noVNC
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "[3/5] Descargando noVNC..."

          $zip = "$env:TEMP\novnc.zip"

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.7.0.zip" `
            -OutFile $zip

          if (!(Test-Path $zip)) {
            throw "No se pudo descargar noVNC."
          }

          Remove-Item `
            -Path "C:\noVNC" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Expand-Archive `
            -Path $zip `
            -DestinationPath "C:\noVNC" `
            -Force

          $folder = Get-ChildItem `
            -Path "C:\noVNC" `
            -Directory |
            Select-Object -First 1

          if ($null -eq $folder) {
            throw "No se encontró la carpeta de noVNC."
          }

          $novnc = $folder.FullName

          if (!(Test-Path "$novnc\vnc.html")) {
            throw "No se encontró vnc.html."
          }

          if (!(Test-Path "$novnc\utils\novnc_proxy")) {
            throw "No se encontró utils\novnc_proxy."
          }

          Write-Host "[OK] noVNC encontrado."
          Write-Host "[OK] Ruta: $novnc"

          "NOVNC_PATH=$novnc" >> $env:GITHUB_ENV


      # ============================================================
      # 6. WEBSOCKIFY
      # ============================================================

      - name: Instalar Websockify
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "[4/5] Instalando Websockify..."

          python -m pip install --upgrade pip

          python -m pip install websockify==0.13.0

          Write-Host "[OK] Websockify instalado."


      # ============================================================
      # 7. ARRANCAR NOVNC
      # ============================================================

      - name: Iniciar noVNC
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "Iniciando noVNC..."

          $novnc = $env:NOVNC_PATH

          $proxy = "$novnc\utils\novnc_proxy"

          $stdout = "C:\novnc-output.log"
          $stderr = "C:\novnc-error.log"

          Remove-Item `
            $stdout `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $stderr `
            -Force `
            -ErrorAction SilentlyContinue

          if (!(Test-Path $proxy)) {
            throw "No existe novnc_proxy."
          }

          Write-Host "[OK] novnc_proxy encontrado."

          # IMPORTANTE:
          # No usamos --allow-loopback.
          #
          # novnc_proxy recibe directamente el VNC:
          #
          #     127.0.0.1:5900
          #
          # y escucha públicamente en:
          #
          #     0.0.0.0:6080

          $args = @(
            $proxy
            "--vnc"
            "127.0.0.1:5900"
            "--listen"
            "0.0.0.0:6080"
          )

          Start-Process `
            -FilePath "bash.exe" `
            -ArgumentList $args `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -WindowStyle Hidden

          Write-Host ""
          Write-Host "Esperando noVNC..."

          $ready = $false

          for ($i = 1; $i -le 30; $i++) {

            Start-Sleep -Seconds 1

            $test = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 6080 `
              -WarningAction SilentlyContinue

            if ($test.TcpTestSucceeded) {

              $ready = $true

              Write-Host "[OK] noVNC está escuchando en 6080."

              break
            }

            Write-Host "Esperando... $i/30"
          }

          if (!$ready) {

            Write-Host ""
            Write-Host "========== noVNC ERROR =========="

            if (Test-Path $stderr) {
              Get-Content $stderr
            }

            Write-Host ""
            Write-Host "========== noVNC OUTPUT =========="

            if (Test-Path $stdout) {
              Get-Content $stdout
            }

            throw "noVNC no abrió el puerto 6080."
          }

          Write-Host ""
          Write-Host "Probando página local..."

          try {

            $response = Invoke-WebRequest `
              -Uri "http://127.0.0.1:6080/vnc.html" `
              -UseBasicParsing `
              -TimeoutSec 10

            Write-Host "[OK] noVNC respondió."
            Write-Host "[OK] HTTP $($response.StatusCode)"

          }
          catch {

            Write-Host ""
            Write-Host "========== noVNC ERROR =========="

            if (Test-Path $stderr) {
              Get-Content $stderr
            }

            Write-Host ""
            Write-Host "========== noVNC OUTPUT =========="

            if (Test-Path $stdout) {
              Get-Content $stdout
            }

            throw "noVNC no respondió en /vnc.html."
          }


      # ============================================================
      # 8. CLOUDFLARE QUICK TUNNEL
      # ============================================================

      - name: Crear enlace público
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "[5/5] Creando enlace público..."

          $cloudflared = "C:\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared

          if (!(Test-Path $cloudflared)) {
            throw "No se pudo descargar cloudflared."
          }

          Write-Host "[OK] Cloudflared listo."

          Write-Host ""
          Write-Host "========================================"
          Write-Host "       WINDOWS CLOUD PC LISTO"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "URL:"
          Write-Host "Espera a que Cloudflare muestre:"
          Write-Host ""
          Write-Host "https://xxxxx.trycloudflare.com"
          Write-Host ""
          Write-Host "ABRE:"
          Write-Host ""
          Write-Host "https://xxxxx.trycloudflare.com/vnc.html"
          Write-Host ""
          Write-Host "PASSWORD:"
          Write-Host "12345678"
          Write-Host ""
          Write-Host "========================================"
          Write-Host ""

          & $cloudflared tunnel `
            --no-autoupdate `
            --url "http://127.0.0.1:6080"


      # ============================================================
      # 9. MANTENER EL RUNNER ENCENDIDO
      # ============================================================

      - name: Mantener Cloud PC activo
        if: always()
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "========================================"
          Write-Host "       CLOUD PC EN EJECUCION"
          Write-Host "========================================"

          while ($true) {

            Write-Host "PC activa - $(Get-Date -Format 'HH:mm:ss')"

            Start-Sleep -Seconds 60
          }
