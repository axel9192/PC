name: Windows Cloud PC

on:
  workflow_dispatch:

jobs:
  cloud-pc:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:

      - name: Preparar Windows
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "        WINDOWS CLOUD PC"
          Write-Host "========================================"

          $theme = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

          New-Item -Path $theme -Force | Out-Null

          Set-ItemProperty `
            -Path $theme `
            -Name "AppsUseLightTheme" `
            -Value 0

          Set-ItemProperty `
            -Path $theme `
            -Name "SystemUsesLightTheme" `
            -Value 0

          Write-Host "[OK] Tema oscuro activado."

      - name: Instalar UltraVNC
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[1/4] Instalando UltraVNC..."

          $zip = "$env:TEMP\UltraVNC.zip"

          Invoke-WebRequest `
            -Uri "https://uvnc.eu/download/1800/UltraVNC_1830.zip" `
            -OutFile $zip

          New-Item `
            -ItemType Directory `
            -Path "C:\UltraVNC" `
            -Force | Out-Null

          Expand-Archive `
            -Path $zip `
            -DestinationPath "C:\UltraVNC" `
            -Force

          $vnc = Get-ChildItem `
            -Path "C:\UltraVNC" `
            -Filter "winvnc.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $vnc) {
            throw "No se encontró winvnc.exe"
          }

          Write-Host "[OK] WinVNC encontrado:"
          Write-Host $vnc.FullName

      - name: Configurar UltraVNC
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[2/4] Configurando VNC..."

          $vnc = Get-ChildItem `
            -Path "C:\UltraVNC" `
            -Filter "winvnc.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $vnc) {
            throw "WinVNC no encontrado."
          }

          $dir = $vnc.DirectoryName
          $ini = Join-Path $dir "ultravnc.ini"
          $config = @"
          [ultravnc]
          SocketConnect=1
          PortNumber=5900
          AutoPortSelect=0
          InputsEnabled=1
          AllowLoopback=1
          LoopbackOnly=0
          IdleTimeout=0
          IdleInputTimeout=0
          "@

          Set-Content `
            -Path $ini `
            -Value $config `
            -Encoding ASCII

          Write-Host "[OK] VNC configurado en puerto 5900."

          Write-Host "[...] Iniciando WinVNC..."

          Start-Process `
            -FilePath $vnc.FullName `
            -WorkingDirectory $dir

          Start-Sleep -Seconds 5

          $vncPort = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 5900 `
            -WarningAction SilentlyContinue

          if (-not $vncPort.TcpTestSucceeded) {
            throw "UltraVNC no está escuchando en el puerto 5900."
          }

          Write-Host "[OK] UltraVNC está activo en 5900."

      - name: Instalar noVNC y Websockify
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[3/4] Instalando noVNC + Websockify..."

          $novncZip = "$env:TEMP\novnc.zip"
          $websockifyZip = "$env:TEMP\websockify.zip"

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.7.0.zip" `
            -OutFile $novncZip

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/websockify/archive/refs/tags/v0.13.0.zip" `
            -OutFile $websockifyZip

          Expand-Archive `
            -Path $novncZip `
            -DestinationPath "C:\noVNC" `
            -Force

          Expand-Archive `
            -Path $websockifyZip `
            -DestinationPath "C:\Websockify" `
            -Force

          $novnc = Get-ChildItem `
            -Path "C:\noVNC" `
            -Directory |
            Select-Object -First 1

          $websockify = Get-ChildItem `
            -Path "C:\Websockify" `
            -Directory |
            Select-Object -First 1

          if ($null -eq $novnc) {
            throw "No se encontró noVNC."
          }

          if ($null -eq $websockify) {
            throw "No se encontró Websockify."
          }

          $novncPath = $novnc.FullName
          $websockifyPath = $websockify.FullName

          Write-Host "[OK] noVNC: $novncPath"
          Write-Host "[OK] Websockify: $websockifyPath"

          Write-Host "[...] Iniciando Websockify..."

          Start-Process `
            -FilePath "python" `
            -ArgumentList @(
              "-m",
              "websockify",
              "6080",
              "127.0.0.1:5900",
              "--web",
              $novncPath
            ) `
            -WorkingDirectory $websockifyPath

          Start-Sleep -Seconds 5

          $webPort = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 6080 `
            -WarningAction SilentlyContinue

          if (-not $webPort.TcpTestSucceeded) {
            throw "Websockify no abrió el puerto 6080."
          }

          Write-Host "[OK] noVNC disponible en puerto 6080."

      - name: Crear túnel Cloudflare
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[4/4] Creando túnel Cloudflare..."
          Write-Host ""

          $cloudflared = "C:\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared

          Write-Host "[OK] Cloudflared descargado."
          Write-Host ""
          Write-Host "========================================"
          Write-Host "          CLOUD PC LISTO"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "ABRE LA URL https://...trycloudflare.com"
          Write-Host ""
          Write-Host "NO USES UNA URL DE UNA EJECUCION ANTERIOR."
          Write-Host ""

          & $cloudflared tunnel `
            --no-autoupdate `
            --protocol http2 `
            --url "http://127.0.0.1:6080"

      - name: Mantener PC activa
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "       CLOUD PC EN EJECUCION"
          Write-Host "========================================"

          while ($true) {
            Write-Host "PC activa - $(Get-Date -Format 'HH:mm:ss')"
            Start-Sleep -Seconds 60
          }
