name: Windows Cloud PC

on:
  workflow_dispatch:

jobs:
  cloud-pc:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:

      - name: Preparar Windows
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "       WINDOWS CLOUD PC"
          Write-Host "========================================"

          $theme = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

          New-Item -Path $theme -Force | Out-Null
          Set-ItemProperty -Path $theme -Name "AppsUseLightTheme" -Value 0
          Set-ItemProperty -Path $theme -Name "SystemUsesLightTheme" -Value 0

          Write-Host "[OK] Windows configurado en modo oscuro."

      - name: Descargar UltraVNC
        shell: pwsh
        run: |
          Write-Host "[1/3] Descargando UltraVNC..."

          $zip = "$env:TEMP\UltraVNC.zip"

          Invoke-WebRequest -Uri "https://uvnc.eu/download/1800/UltraVNC_1830.zip" -OutFile $zip

          New-Item -ItemType Directory -Path "C:\UltraVNC" -Force | Out-Null

          Expand-Archive -Path $zip -DestinationPath "C:\UltraVNC" -Force

          Write-Host "[OK] UltraVNC descargado."

      - name: Configurar y ejecutar UltraVNC
        shell: pwsh
        run: |
          Write-Host "[2/3] Buscando WinVNC..."

          $vnc = Get-ChildItem -Path "C:\UltraVNC" -Filter "winvnc.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($null -eq $vnc) {
            throw "No se encontró winvnc.exe"
          }

          $dir = $vnc.DirectoryName
          $ini = Join-Path $dir "ultravnc.ini"

          Write-Host "[OK] WinVNC encontrado."
          Write-Host $vnc.FullName

          $config = @"
          [ultravnc]
          SocketConnect=1
          HTTPConnect=1
          PortNumber=5900
          HTTPPortNumber=5800
          AutoPortSelect=0
          InputsEnabled=1
          AllowLoopback=1
          LoopbackOnly=0
          "@

          Set-Content -Path $ini -Value $config -Encoding ASCII

          Write-Host "[OK] Puerto VNC: 5900"
          Write-Host "[OK] Puerto web: 5800"

          Write-Host "[...] Iniciando UltraVNC..."

          Start-Process -FilePath $vnc.FullName -WorkingDirectory $dir

          Start-Sleep -Seconds 5

          $port = Test-NetConnection -ComputerName "127.0.0.1" -Port 5800 -WarningAction SilentlyContinue

          if (-not $port.TcpTestSucceeded) {
            throw "UltraVNC no abrió el puerto 5800."
          }

          Write-Host "[OK] UltraVNC está escuchando en 5800."

      - name: Iniciar Cloudflare
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[3/3] Iniciando Cloudflare..."
          Write-Host ""
          Write-Host "========================================"
          Write-Host "          CLOUD PC LISTO"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "TU URL APARECERÁ ABAJO:"
          Write-Host ""

          $cloudflared = "C:\cloudflared.exe"

          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile $cloudflared

          Write-Host "[OK] Cloudflared descargado."
          Write-Host ""

          & $cloudflared tunnel --no-autoupdate --protocol http2 --url "http://127.0.0.1:5800"
