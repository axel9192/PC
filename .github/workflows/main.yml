name: Windows Cloud PC - TightVNC + noVNC + Cloudflare

on:
  workflow_dispatch:

jobs:
  cloud-pc:
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      VNC_PASSWORD: "12345678"
      VNC_PORT: "5900"
      NOVNC_PORT: "6080"

    steps:

      - name: Configurar Windows
        shell: pwsh
        run: |
          powercfg /hibernate off
          powercfg /change standby-timeout-ac 0
          powercfg /change monitor-timeout-ac 0
          powercfg /change disk-timeout-ac 0

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar TightVNC
        shell: pwsh
        run: |
          $installer = "$env:TEMP\tightvnc.msi"

          Invoke-WebRequest `
            -Uri "https://www.tightvnc.com/download/2.8.90/tightvnc-2.8.90-gpl-setup-64bit.msi" `
            -OutFile $installer

          $args = @(
            "/i"
            "`"$installer`""
            "/quiet"
            "/norestart"
            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"
            "SET_PASSWORD=1"
            "VALUE_OF_PASSWORD=$env:VNC_PASSWORD"
            "SET_ALLOWLOOPBACK=1"
            "VALUE_OF_ALLOWLOOPBACK=1"
            "SET_ACCEPTRFBCONNECTIONS=1"
            "VALUE_OF_ACCEPTRFBCONNECTIONS=1"
          )

          $p = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $args `
            -Wait `
            -PassThru

          if ($p.ExitCode -ne 0) {
            throw "Error instalando TightVNC: $($p.ExitCode)"
          }

      - name: Iniciar Cloud PC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # -------------------------
          # TightVNC
          # -------------------------

          $tvn = "C:\Program Files\TightVNC\tvnserver.exe"

          if (!(Test-Path $tvn)) {
            throw "No se encontró TightVNC"
          }

          & $tvn -install -silent
          Start-Sleep -Seconds 2
          & $tvn -start -silent

          Start-Sleep -Seconds 5

          $vnc = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 5900 `
            -WarningAction SilentlyContinue

          if (!$vnc.TcpTestSucceeded) {
            throw "TightVNC no está escuchando en el puerto 5900"
          }

          Write-Host "TightVNC OK"

          # -------------------------
          # noVNC
          # -------------------------

          $zip = "$env:TEMP\novnc.zip"
          $novncRoot = "C:\noVNC"

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.7.0.zip" `
            -OutFile $zip

          Remove-Item $novncRoot -Recurse -Force -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Path $novncRoot `
            -Force | Out-Null

          Expand-Archive `
            -Path $zip `
            -DestinationPath $novncRoot `
            -Force

          $folder = Get-ChildItem `
            $novncRoot `
            -Directory |
            Select-Object -First 1

          if ($null -eq $folder) {
            throw "No se encontró noVNC"
          }

          $novncPath = $folder.FullName

          Write-Host "noVNC: $novncPath"

          # -------------------------
          # Websockify
          # -------------------------

          python -m pip install websockify==0.13.0

          $webOut = "C:\websockify-out.log"
          $webErr = "C:\websockify-err.log"

          Remove-Item $webOut -Force -ErrorAction SilentlyContinue
          Remove-Item $webErr -Force -ErrorAction SilentlyContinue

          $webArgs = @(
            "-m"
            "websockify"
            "--web"
            $novncPath
            "0.0.0.0:6080"
            "127.0.0.1:5900"
          )

          $web = Start-Process `
            -FilePath "python.exe" `
            -ArgumentList $webArgs `
            -RedirectStandardOutput $webOut `
            -RedirectStandardError $webErr `
            -WindowStyle Hidden `
            -PassThru

          Start-Sleep -Seconds 5

          if ($web.HasExited) {
            if (Test-Path $webErr) {
              Get-Content $webErr
            }

            throw "Websockify no pudo iniciar"
          }

          $novnc = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 6080 `
            -WarningAction SilentlyContinue

          if (!$novnc.TcpTestSucceeded) {
            if (Test-Path $webErr) {
              Get-Content $webErr
            }

            throw "noVNC no está escuchando en el puerto 6080"
          }

          Write-Host "noVNC OK"

          # -------------------------
          # Cloudflare Tunnel
          # -------------------------

          $cloudflared = "$env:TEMP\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared

          $cfOut = "C:\cloudflare-out.log"
          $cfErr = "C:\cloudflare-err.log"

          Remove-Item $cfOut -Force -ErrorAction SilentlyContinue
          Remove-Item $cfErr -Force -ErrorAction SilentlyContinue

          $cfArgs = @(
            "tunnel"
            "--url"
            "http://127.0.0.1:6080"
            "--no-autoupdate"
          )

          $cf = Start-Process `
            -FilePath $cloudflared `
            -ArgumentList $cfArgs `
            -RedirectStandardOutput $cfOut `
            -RedirectStandardError $cfErr `
            -WindowStyle Hidden `
            -PassThru

          # -------------------------
          # Esperar URL
          # -------------------------

          $url = $null

          for ($i = 1; $i -le 30; $i++) {

            Start-Sleep -Seconds 2

            $logs = ""

            if (Test-Path $cfOut) {
              $logs += Get-Content $cfOut -Raw
            }

            if (Test-Path $cfErr) {
              $logs += Get-Content $cfErr -Raw
            }

            if ($logs -match 'https://[a-zA-Z0-9-]+\.trycloudflare\.com') {
              $url = $matches[0]
              break
            }

            if ($cf.HasExited) {
              break
            }
          }

          if (!$url) {
            Write-Host ""
            Write-Host "===== CLOUDFLARE ====="

            if (Test-Path $cfOut) {
              Get-Content $cfOut
            }

            if (Test-Path $cfErr) {
              Get-Content $cfErr
            }

            throw "Cloudflare no generó una URL"
          }

          # -------------------------
          # Cloud PC listo
          # -------------------------

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          WINDOWS CLOUD PC LISTO"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "ABRIR EN EL TELEFONO:"
          Write-Host ""
          Write-Host "$url/vnc.html"
          Write-Host ""
          Write-Host "CONTRASEÑA:"
          Write-Host "$env:VNC_PASSWORD"
          Write-Host ""
          Write-Host "=========================================="
          Write-Host ""

          # Mantener todo funcionando
          while ($true) {

            Start-Sleep -Seconds 30

            if ($cf.HasExited) {
              throw "Cloudflare Tunnel se cerró"
            }

            if ($web.HasExited) {
              throw "Websockify se cerró"
            }

            $checkVnc = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 5900 `
              -WarningAction SilentlyContinue

            $checkWeb = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 6080 `
              -WarningAction SilentlyContinue

            if (!$checkVnc.TcpTestSucceeded) {
              throw "El puerto VNC 5900 dejó de responder"
            }

            if (!$checkWeb.TcpTestSucceeded) {
              throw "El puerto noVNC 6080 dejó de responder"
            }
          }
