name: Windows Cloud PC - TightVNC + noVNC

on:
  workflow_dispatch:

jobs:
  cloud-pc:

    runs-on: windows-2025

    timeout-minutes: 360

    steps:

      # ==========================================================
      # 1. PREPARAR WINDOWS
      # ==========================================================

      - name: Preparar Windows
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "        WINDOWS CLOUD PC"
          Write-Host "========================================"

          $theme = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

          New-Item -Path $theme -Force | Out-Null

          Set-ItemProperty `
            -Path $theme `
            -Name "AppsUseLightTheme" `
            -Value 0

          Set-ItemProperty `
            -Path $theme `
            -Name "SystemUsesLightTheme" `
            -Value 0

          Write-Host "[OK] Tema oscuro activado."


      # ==========================================================
      # 2. PYTHON
      # ==========================================================

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================================
      # 3. INSTALAR TIGHTVNC
      # ==========================================================

      - name: Instalar TightVNC
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "[1/4] Instalando TightVNC..."

          $installer = "$env:TEMP\tightvnc.msi"

          $url = "https://www.tightvnc.com/download/2.8.90/tightvnc-2.8.90-gpl-setup-64bit.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          if (!(Test-Path $installer)) {
            throw "No se pudo descargar TightVNC."
          }

          $size = (Get-Item $installer).Length

          Write-Host "[OK] Instalador descargado."
          Write-Host "[OK] Tamaño: $size bytes"

          if ($size -lt 1000000) {
            throw "El instalador descargado parece incorrecto."
          }

          $arguments = @(
            "/i"
            "`"$installer`""
            "/quiet"
            "/norestart"

            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"

            "SET_PASSWORD=1"
            "VALUE_OF_PASSWORD=12345678"

            "SET_VIEWONLYPASSWORD=1"
            "VALUE_OF_VIEWONLYPASSWORD=12345678"
          )

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "TightVNC falló. Código: $($process.ExitCode)"
          }

          Write-Host "[OK] TightVNC instalado."


      # ==========================================================
      # 4. INICIAR TIGHTVNC
      # ==========================================================

      - name: Iniciar TightVNC
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "[2/4] Iniciando TightVNC..."

          $server = "C:\Program Files\TightVNC\tvnserver.exe"

          if (!(Test-Path $server)) {
            throw "No existe:"
            Write-Host $server
          }

          Write-Host "[OK] $server"

          & $server -install -silent

          Start-Sleep -Seconds 3

          & $server -start -silent

          Start-Sleep -Seconds 5

          $vnc = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 5900 `
            -WarningAction SilentlyContinue

          if (!$vnc.TcpTestSucceeded) {

            Write-Host ""
            Write-Host "===== SERVICIOS TIGHTVNC ====="

            Get-Service |
              Where-Object {
                $_.Name -like "*Tight*" -or
                $_.DisplayName -like "*TightVNC*"
              } |
              Format-Table -AutoSize

            throw "TightVNC no está escuchando en 5900."
          }

          Write-Host "[OK] TightVNC escuchando en 5900."


      # ==========================================================
      # 5. DESCARGAR NOVNC
      # ==========================================================

      - name: Descargar noVNC
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "[3/4] Descargando noVNC..."

          $zip = "$env:TEMP\novnc.zip"

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.7.0.zip" `
            -OutFile $zip

          if (!(Test-Path $zip)) {
            throw "No se pudo descargar noVNC."
          }

          Expand-Archive `
            -Path $zip `
            -DestinationPath "C:\noVNC" `
            -Force

          $novnc = Get-ChildItem `
            -Path "C:\noVNC" `
            -Directory |
            Select-Object -First 1

          if ($null -eq $novnc) {
            throw "No se encontró la carpeta de noVNC."
          }

          $novncPath = $novnc.FullName

          Write-Host "[OK] noVNC:"
          Write-Host $novncPath

          if (!(Test-Path "$novncPath\vnc.html")) {
            throw "No se encontró vnc.html."
          }

          Write-Host "[OK] vnc.html encontrado."

          "NOVNC_PATH=$novncPath" >> $env:GITHUB_ENV


      # ==========================================================
      # 6. INSTALAR WEBSOCKIFY
      # ==========================================================

      - name: Instalar Websockify
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "[...] Instalando Websockify..."

          python -m pip install --upgrade pip

          python -m pip install websockify==0.13.0

          Write-Host "[OK] Websockify instalado."

          python -m websockify --help |
            Select-Object -First 8


      # ==========================================================
      # 7. INICIAR NOVNC PROXY
      # ==========================================================

      - name: Iniciar noVNC Proxy
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "[...] Iniciando noVNC..."

          $novnc = $env:NOVNC_PATH

          $stdout = "C:\novnc-out.log"
          $stderr = "C:\novnc-error.log"

          Remove-Item `
            $stdout `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $stderr `
            -Force `
            -ErrorAction SilentlyContinue

          $script = "$novnc\utils\novnc_proxy"

          if (!(Test-Path $script)) {
            throw "No se encontró utils\novnc_proxy."
          }

          Write-Host "[OK] novnc_proxy encontrado."

          # Ejecutamos el proxy que proporciona noVNC.
          # Él mismo levanta el WebSocket proxy y el servidor web.

          $arguments = @(
            $script
            "--vnc"
            "127.0.0.1:5900"
            "--listen"
            "0.0.0.0:6080"
          )

          Start-Process `
            -FilePath "bash.exe" `
            -ArgumentList $arguments `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -WindowStyle Hidden

          Write-Host ""
          Write-Host "[...] Esperando noVNC..."

          $ready = $false

          for ($i = 1; $i -le 30; $i++) {

            Start-Sleep -Seconds 1

            $test = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 6080 `
              -WarningAction SilentlyContinue

            if ($test.TcpTestSucceeded) {

              $ready = $true

              Write-Host "[OK] Puerto 6080 abierto."

              break
            }

            Write-Host "Esperando noVNC... $i/30"
          }

          Write-Host ""
          Write-Host "========== NOVNC OUTPUT =========="

          if (Test-Path $stdout) {
            Get-Content $stdout
          }

          Write-Host ""
          Write-Host "========== NOVNC ERROR =========="

          if (Test-Path $stderr) {
            Get-Content $stderr
          }

          if (!$ready) {
            throw "noVNC no abrió el puerto 6080."
          }

          Write-Host ""
          Write-Host "[...] Probando página web..."

          try {

            $response = Invoke-WebRequest `
              -Uri "http://127.0.0.1:6080/vnc.html" `
              -UseBasicParsing `
              -TimeoutSec 10

            Write-Host "[OK] noVNC respondió."
            Write-Host "[OK] HTTP $($response.StatusCode)"

          }
          catch {

            Write-Host ""
            Write-Host "La página no respondió correctamente."

            Write-Host ""
            Write-Host "========== NOVNC OUTPUT =========="

            if (Test-Path $stdout) {
              Get-Content $stdout
            }

            Write-Host ""
            Write-Host "========== NOVNC ERROR =========="

            if (Test-Path $stderr) {
              Get-Content $stderr
            }

            throw "noVNC abrió 6080 pero no respondió /vnc.html."
          }


      # ==========================================================
      # 8. CLOUDFLARE
      # ==========================================================

      - name: Iniciar Cloudflare
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "[4/4] Iniciando Cloudflare..."

          $cloudflared = "C:\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared

          if (!(Test-Path $cloudflared)) {
            throw "No se pudo descargar Cloudflared."
          }

          Write-Host "[OK] Cloudflared descargado."

          Write-Host ""
          Write-Host "========================================"
          Write-Host "          CLOUD PC LISTO"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "ESPERA LA URL:"
          Write-Host ""
          Write-Host "https://xxxxx.trycloudflare.com"
          Write-Host ""
          Write-Host "ABRE:"
          Write-Host ""
          Write-Host "https://xxxxx.trycloudflare.com/vnc.html"
          Write-Host ""
          Write-Host "CONTRASEÑA VNC:"
          Write-Host "12345678"
          Write-Host ""
          Write-Host "========================================"
          Write-Host ""

          & $cloudflared tunnel `
            --no-autoupdate `
            --url "http://127.0.0.1:6080"


      # ==========================================================
      # 9. MANTENER ACTIVO
      # ==========================================================

      - name: Mantener PC activa
        if: always()
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "========================================"
          Write-Host "       CLOUD PC EN EJECUCION"
          Write-Host "========================================"

          while ($true) {

            Write-Host "PC activa - $(Get-Date -Format 'HH:mm:ss')"

            Start-Sleep -Seconds 60
          }
