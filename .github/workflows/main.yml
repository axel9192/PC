name: Windows Cloud PC - TightVNC + noVNC

on:
  workflow_dispatch:

jobs:
  cloud-pc:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:

      # ==========================================================
      # 1. WINDOWS
      # ==========================================================

      - name: Preparar Windows
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "        WINDOWS CLOUD PC"
          Write-Host "========================================"

          $theme = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

          New-Item -Path $theme -Force | Out-Null

          Set-ItemProperty -Path $theme -Name "AppsUseLightTheme" -Value 0
          Set-ItemProperty -Path $theme -Name "SystemUsesLightTheme" -Value 0

          Write-Host "[OK] Tema oscuro activado."


      # ==========================================================
      # 2. TIGHTVNC
      # ==========================================================

      - name: Instalar TightVNC
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[1/4] Descargando TightVNC..."

          $installer = "$env:TEMP\tightvnc.msi"

          Invoke-WebRequest `
            -Uri "https://www.tightvnc.com/download/2.8.90/tightvnc-2.8.90-gpl-setup-64bit.msi" `
            -OutFile $installer

          if (!(Test-Path $installer)) {
            throw "No se pudo descargar TightVNC."
          }

          Write-Host "[OK] Instalador descargado."

          $arguments = @(
            "/i"
            "`"$installer`""
            "/quiet"
            "/norestart"

            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"

            "SET_PASSWORD=1"
            "VALUE_OF_PASSWORD=12345678"

            "SET_VIEWONLYPASSWORD=1"
            "VALUE_OF_VIEWONLYPASSWORD=12345678"
          )

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "TightVNC falló. Código: $($process.ExitCode)"
          }

          Write-Host "[OK] TightVNC instalado."


      # ==========================================================
      # 3. INICIAR TIGHTVNC
      # ==========================================================

      - name: Iniciar TightVNC
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[2/4] Iniciando TightVNC..."

          $server = "C:\Program Files\TightVNC\tvnserver.exe"

          if (!(Test-Path $server)) {
            throw "No existe: $server"
          }

          Write-Host "[OK] Servidor encontrado."

          & $server -install -silent

          Start-Sleep -Seconds 3

          & $server -start -silent

          Start-Sleep -Seconds 5

          $vnc = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 5900 `
            -WarningAction SilentlyContinue

          if (!$vnc.TcpTestSucceeded) {
            throw "TightVNC no está escuchando en 5900."
          }

          Write-Host "[OK] TightVNC escuchando en 5900."


      # ==========================================================
      # 4. PYTHON
      # ==========================================================

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================================
      # 5. DESCARGAR NOVNC
      # ==========================================================

      - name: Descargar noVNC
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[3/4] Descargando noVNC..."

          $zip = "$env:TEMP\novnc.zip"

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.7.0.zip" `
            -OutFile $zip

          if (!(Test-Path $zip)) {
            throw "No se pudo descargar noVNC."
          }

          Expand-Archive `
            -Path $zip `
            -DestinationPath "C:\noVNC" `
            -Force

          $novnc = Get-ChildItem `
            -Path "C:\noVNC" `
            -Directory |
            Select-Object -First 1

          if ($null -eq $novnc) {
            throw "No se encontró noVNC."
          }

          "NOVNC_PATH=$($novnc.FullName)" >> $env:GITHUB_ENV

          Write-Host "[OK] noVNC: $($novnc.FullName)"


      # ==========================================================
      # 6. WEBSOCKIFY
      # ==========================================================

      - name: Iniciar Websockify
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[...] Instalando Websockify..."

          python -m pip install --upgrade pip
          python -m pip install websockify==0.13.0

          Write-Host "[OK] Websockify instalado."

          $stdout = "C:\websockify-out.log"
          $stderr = "C:\websockify-error.log"

          Remove-Item $stdout -Force -ErrorAction SilentlyContinue
          Remove-Item $stderr -Force -ErrorAction SilentlyContinue

          Write-Host "[...] Iniciando Websockify..."

          $arguments = @(
            "-m"
            "websockify"
            "--verbose"
            "--web"
            $env:NOVNC_PATH
            "6080"
            "127.0.0.1:5900"
          )

          Start-Process `
            -FilePath "python.exe" `
            -ArgumentList $arguments `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -WindowStyle Hidden

          Write-Host "[...] Esperando puerto 6080..."

          $ready = $false

          for ($i = 1; $i -le 30; $i++) {

            Start-Sleep -Seconds 1

            $test = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 6080 `
              -WarningAction SilentlyContinue

            if ($test.TcpTestSucceeded) {
              $ready = $true
              break
            }

            Write-Host "Esperando Websockify... $i/30"
          }

          Write-Host ""
          Write-Host "========== WEBSOCKIFY OUTPUT =========="

          if (Test-Path $stdout) {
            Get-Content $stdout
          }

          Write-Host ""
          Write-Host "========== WEBSOCKIFY ERRORS =========="

          if (Test-Path $stderr) {
            Get-Content $stderr
          }

          Write-Host ""

          if (!$ready) {
            throw "Websockify no abrió el puerto 6080."
          }

          Write-Host "[OK] Websockify escuchando en 6080."


      # ==========================================================
      # 7. CLOUDFLARE
      # ==========================================================

      - name: Iniciar Cloudflare
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[4/4] Iniciando Cloudflare..."

          $cloudflared = "C:\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared

          if (!(Test-Path $cloudflared)) {
            throw "No se pudo descargar Cloudflared."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "          CLOUD PC LISTO"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Busca la URL trycloudflare.com"
          Write-Host ""
          Write-Host "ABRE:"
          Write-Host "https://TU-URL.trycloudflare.com/vnc.html"
          Write-Host ""
          Write-Host "CONTRASEÑA:"
          Write-Host "12345678"
          Write-Host ""
          Write-Host "========================================"

          & $cloudflared tunnel `
            --no-autoupdate `
            --protocol http2 `
            --url "http://127.0.0.1:6080"


      # ==========================================================
      # 8. MANTENER ACTIVO
      # ==========================================================

      - name: Mantener PC activa
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "       CLOUD PC EN EJECUCION"
          Write-Host "========================================"

          while ($true) {
            Write-Host "PC activa - $(Get-Date -Format 'HH:mm:ss')"
            Start-Sleep -Seconds 60
          }
