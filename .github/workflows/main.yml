name: Windows Cloud PC

on:
  workflow_dispatch:

jobs:
  cloud-pc:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:

      - name: Preparar Windows
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "        WINDOWS CLOUD PC"
          Write-Host "========================================"

          $theme = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

          New-Item -Path $theme -Force | Out-Null
          Set-ItemProperty -Path $theme -Name "AppsUseLightTheme" -Value 0
          Set-ItemProperty -Path $theme -Name "SystemUsesLightTheme" -Value 0

          Write-Host "[OK] Tema oscuro activado."

      - name: Instalar UltraVNC
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[1/4] Descargando UltraVNC..."

          $zip = "$env:TEMP\UltraVNC.zip"

          Invoke-WebRequest `
            -Uri "https://uvnc.eu/download/1800/UltraVNC_1830.zip" `
            -OutFile $zip

          New-Item `
            -ItemType Directory `
            -Path "C:\UltraVNC" `
            -Force | Out-Null

          Expand-Archive `
            -Path $zip `
            -DestinationPath "C:\UltraVNC" `
            -Force

          $vnc = Get-ChildItem `
            -Path "C:\UltraVNC" `
            -Filter "winvnc.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $vnc) {
            throw "No se encontró winvnc.exe"
          }

          Write-Host "[OK] UltraVNC encontrado:"
          Write-Host $vnc.FullName

      - name: Configurar UltraVNC
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[2/4] Configurando servidor..."

          $vnc = Get-ChildItem `
            -Path "C:\UltraVNC" `
            -Filter "winvnc.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $dir = $vnc.DirectoryName
          $ini = Join-Path $dir "ultravnc.ini"

          $config = @"
          [ultravnc]
          SocketConnect=1
          HTTPConnect=1
          PortNumber=5900
          HTTPPortNumber=5800
          AutoPortSelect=0
          InputsEnabled=1
          AllowLoopback=1
          LoopbackOnly=0
          IdleTimeout=0
          IdleInputTimeout=0
          "@

          Set-Content `
            -Path $ini `
            -Value $config `
            -Encoding ASCII

          Write-Host "[OK] Socket VNC: 5900"
          Write-Host "[OK] HTTP/noVNC: 5800"
          Write-Host "[OK] Sin timeout de inactividad."

          Write-Host ""
          Write-Host "[...] Iniciando WinVNC..."

          Start-Process `
            -FilePath $vnc.FullName `
            -WorkingDirectory $dir

          Start-Sleep -Seconds 5

          Write-Host "[OK] WinVNC iniciado."

      - name: Comprobar noVNC
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[3/4] Comprobando servidor web..."

          $ready = $false

          for ($i = 1; $i -le 30; $i++) {

            $test = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 5800 `
              -WarningAction SilentlyContinue

            if ($test.TcpTestSucceeded) {
              $ready = $true
              break
            }

            Write-Host "Esperando puerto 5800... $i/30"
            Start-Sleep -Seconds 2
          }

          if (-not $ready) {
            throw "UltraVNC no abrió el puerto HTTP 5800."
          }

          Write-Host "[OK] Puerto 5800 abierto."

          try {
            $page = Invoke-WebRequest `
              -Uri "http://127.0.0.1:5800/" `
              -UseBasicParsing `
              -TimeoutSec 15

            Write-Host "[OK] HTTP responde."
            Write-Host "[OK] Código HTTP: $($page.StatusCode)"
          }
          catch {
            throw "El puerto 5800 está abierto pero el servidor HTTP no respondió."
          }

      - name: Crear túnel Cloudflare
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[4/4] Creando túnel Cloudflare..."
          Write-Host ""

          $cloudflared = "C:\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared

          Write-Host "[OK] Cloudflared descargado."
          Write-Host ""
          Write-Host "========================================"
          Write-Host "          CLOUD PC LISTO"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Espera la URL que comienza con:"
          Write-Host "https://"
          Write-Host ""
          Write-Host "NO uses una URL de una ejecución anterior."
          Write-Host ""

          & $cloudflared tunnel `
            --no-autoupdate `
            --protocol http2 `
            --url "http://127.0.0.1:5800"

      - name: Mantener PC activa
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "       MANTENIENDO CLOUD PC ACTIVA"
          Write-Host "========================================"

          while ($true) {
            Write-Host "Cloud PC activa - $(Get-Date -Format 'HH:mm:ss')"
            Start-Sleep -Seconds 60
          }
