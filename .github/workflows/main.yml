name: Windows Cloud PC - Scream + UltraVNC + noVNC

on:
  workflow_dispatch:

jobs:
  cloud-pc:
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      VNC_PORT: 5900
      NOVNC_PORT: 6080

    steps:

      # ============================================================
      # AUDIO
      # ============================================================

      - name: Iniciar servicios de audio
        shell: pwsh
        run: |
          Start-Service AudioEndpointBuilder -ErrorAction SilentlyContinue
          Start-Service Audiosrv -ErrorAction SilentlyContinue

          Get-Service AudioEndpointBuilder,Audiosrv |
            Format-Table Name,Status,StartType


      - name: Comprobar audio
        shell: pwsh
        run: |
          Get-CimInstance Win32_SoundDevice |
            Select-Object Name,Status,Manufacturer |
            Format-Table -AutoSize


      # ============================================================
      # SCREAM
      # ============================================================

      - name: Descargar Scream
        shell: pwsh
        run: |
          $url = "https://github.com/duncanthrax/scream/releases/download/3.6/Scream3.6.zip"
          $zip = "C:\Scream3.6.zip"
          $dir = "C:\Scream"

          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $zip

          Expand-Archive `
            -Path $zip `
            -DestinationPath $dir `
            -Force

          Write-Host "Scream descargado."


      - name: Instalar Scream
        shell: pwsh
        run: |
          $inf = "C:\Scream\Install\driver\Scream.inf"
          $devcon = "C:\Scream\Install\helpers\devcon.exe"

          if (-not (Test-Path $inf)) {
            Write-Error "No se encontró Scream.inf"
            exit 1
          }

          if (-not (Test-Path $devcon)) {
            Write-Error "No se encontró devcon.exe"
            exit 1
          }

          $sys = "C:\Scream\Install\driver\Scream.sys"

          $signature = Get-AuthenticodeSignature $sys

          if ($signature.SignerCertificate) {
            try {
              $store = New-Object System.Security.Cryptography.X509Certificates.X509Store(
                "TrustedPublisher",
                "LocalMachine"
              )

              $store.Open(
                [System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite
              )

              $store.Add($signature.SignerCertificate)
              $store.Close()
            }
            catch {
              Write-Host "No fue necesario instalar el certificado."
            }
          }

          & $devcon install $inf "*Scream"

          Start-Sleep -Seconds 5

          Start-Service AudioEndpointBuilder -ErrorAction SilentlyContinue
          Start-Service Audiosrv -ErrorAction SilentlyContinue

          Write-Host "Scream instalado."


      - name: Comprobar Scream
        shell: pwsh
        run: |
          Write-Host "Dispositivos de audio:"

          Get-CimInstance Win32_SoundDevice |
            Select-Object Name,Status,Manufacturer |
            Format-Table -AutoSize


      # ============================================================
      # ULTRAVNC
      # ============================================================

      - name: Descargar UltraVNC 1.8.2.4
        shell: pwsh
        run: |
          $installer = "C:\UltraVNC_1824_x64_Setup.exe"

          $url = "https://uvnc.eu/download/1800/UltraVNC_1824_x64_Setup.exe"

          Write-Host "Descargando UltraVNC 1.8.2.4..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            Write-Error "No se pudo descargar UltraVNC."
            exit 1
          }

          Write-Host "UltraVNC descargado."


      - name: Instalar UltraVNC
        shell: pwsh
        run: |
          $installer = "C:\UltraVNC_1824_x64_Setup.exe"

          Write-Host "Instalando UltraVNC..."

          $arguments = @(
            "/SP-",
            "/VERYSILENT",
            "/NORESTART",
            "/COMPONENTS=UltraVNC_Server",
            "/TASKS=installservice,startservice"
          )

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host "Código de instalación: $($process.ExitCode)"

          Start-Sleep -Seconds 8

          Write-Host ""
          Write-Host "Buscando winvnc.exe..."

          $locations = @(
            "C:\Program Files",
            "C:\Program Files (x86)"
          )

          $winvnc = $null

          foreach ($location in $locations) {

            if (Test-Path $location) {

              $found = Get-ChildItem `
                $location `
                -Filter "winvnc.exe" `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                $winvnc = $found
                break
              }
            }
          }

          if (-not $winvnc) {

            Write-Host ""
            Write-Host "No se encontró winvnc.exe."
            Write-Host ""
            Write-Host "Directorios UltraVNC encontrados:"

            Get-ChildItem `
              "C:\Program Files" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Where-Object {
                $_.FullName -match "UltraVNC|uvnc"
              } |
              Select-Object FullName

            exit 1
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "UltraVNC encontrado:"
          Write-Host $winvnc.FullName
          Write-Host "============================================"

          "UVNC_EXE=$($winvnc.FullName)" |
            Out-File $env:GITHUB_ENV -Append

          "UVNC_DIR=$($winvnc.DirectoryName)" |
            Out-File $env:GITHUB_ENV -Append


      # ============================================================
      # CONFIGURACIÓN ULTRAVNC
      # ============================================================

      - name: Configurar UltraVNC
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |

          if ([string]::IsNullOrWhiteSpace($env:VNC_PASSWORD)) {
            Write-Error "No existe el secret VNC_PASSWORD."
            exit 1
          }

          if ($env:VNC_PASSWORD.Length -gt 8) {
            Write-Error "VNC_PASSWORD debe tener máximo 8 caracteres."
            exit 1
          }

          $programData = "$env:ProgramData\UltraVNC"

          New-Item `
            -ItemType Directory `
            -Path $programData `
            -Force | Out-Null

          $ini = "$programData\ultravnc.ini"

          Write-Host "Buscando herramienta de contraseña..."

          $setpasswd = Get-ChildItem `
            $env:UVNC_DIR `
            -Filter "setpasswd.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $createpassword = Get-ChildItem `
            $env:UVNC_DIR `
            -Filter "createpassword.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($setpasswd) {

            Write-Host "Encontrado setpasswd.exe:"
            Write-Host $setpasswd.FullName

            @"
          [admin]
          UseRegistry=0
          MSLogonRequired=0
          NewMSLogon=0
          AuthRequired=1
          AllowLoopback=1
          LoopbackOnly=0
          SocketConnect=1
          HTTPConnect=0
          AutoPortSelect=0
          PortNumber=5900
          InputsEnabled=1
          FileTransferEnabled=0
          "@ | Out-File `
              $ini `
              -Encoding ascii

            Push-Location $programData

            & $setpasswd.FullName $env:VNC_PASSWORD

            $result = $LASTEXITCODE

            Pop-Location

            if ($result -ne 0) {
              Write-Error "setpasswd.exe falló."
              exit 1
            }

          }
          elseif ($createpassword) {

            Write-Host "Encontrado createpassword.exe:"
            Write-Host $createpassword.FullName

            @"
          [admin]
          UseRegistry=0
          MSLogonRequired=0
          NewMSLogon=0
          AuthRequired=1
          AllowLoopback=1
          LoopbackOnly=0
          SocketConnect=1
          HTTPConnect=0
          AutoPortSelect=0
          PortNumber=5900
          InputsEnabled=1
          FileTransferEnabled=0
          "@ | Out-File `
              $ini `
              -Encoding ascii

            Push-Location $programData

            & $createpassword.FullName $env:VNC_PASSWORD

            $result = $LASTEXITCODE

            Pop-Location

            if ($result -ne 0) {
              Write-Error "createpassword.exe falló."
              exit 1
            }

          }
          else {

            Write-Host "No se encontró herramienta de contraseña."

            Write-Host ""
            Write-Host "Archivos de UltraVNC:"

            Get-ChildItem `
              $env:UVNC_DIR `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object FullName

            exit 1
          }

          # Asegurar configuración principal
          Add-Content $ini @"

          [admin]
          UseRegistry=0
          MSLogonRequired=0
          NewMSLogon=0
          AuthRequired=1
          AllowLoopback=1
          LoopbackOnly=0
          SocketConnect=1
          HTTPConnect=0
          AutoPortSelect=0
          PortNumber=5900
          InputsEnabled=1
          FileTransferEnabled=0
          "@

          Write-Host ""
          Write-Host "ultravnc.ini:"
          Get-Content $ini


      # ============================================================
      # FIREWALL
      # ============================================================

      - name: Configurar firewall
        shell: pwsh
        run: |

          Remove-NetFirewallRule `
            -DisplayName "UltraVNC 5900" `
            -ErrorAction SilentlyContinue

          Remove-NetFirewallRule `
            -DisplayName "noVNC 6080" `
            -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "UltraVNC 5900" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 5900 `
            -Action Allow

          New-NetFirewallRule `
            -DisplayName "noVNC 6080" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 6080 `
            -Action Allow


      # ============================================================
      # INICIAR ULTRAVNC
      # ============================================================

      - name: Iniciar UltraVNC
        shell: pwsh
        run: |

          Write-Host "Iniciando:"
          Write-Host $env:UVNC_EXE

          if (-not (Test-Path $env:UVNC_EXE)) {
            Write-Error "winvnc.exe no existe."
            exit 1
          }

          Start-Process `
            -FilePath $env:UVNC_EXE `
            -WorkingDirectory $env:UVNC_DIR

          Start-Sleep -Seconds 10

          Write-Host ""
          Write-Host "Procesos UltraVNC:"

          Get-Process winvnc `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Puerto 5900:"

          Get-NetTCPConnection `
            -LocalPort 5900 `
            -ErrorAction SilentlyContinue |
            Format-Table -AutoSize

          $vnc = Get-NetTCPConnection `
            -LocalPort 5900 `
            -ErrorAction SilentlyContinue

          if (-not $vnc) {

            Write-Host ""
            Write-Host "UltraVNC no abrió el puerto 5900."

            if (Test-Path "$env:UVNC_DIR\winvnc.log") {
              Get-Content "$env:UVNC_DIR\winvnc.log"
            }

            exit 1
          }

          Write-Host "UltraVNC funcionando."


      # ============================================================
      # NOVNC
      # ============================================================

      - name: Descargar noVNC
        shell: pwsh
        run: |

          $dir = "C:\noVNC"

          Remove-Item `
            $dir `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          git clone `
            --depth 1 `
            https://github.com/novnc/noVNC.git `
            $dir

          if (-not (Test-Path "$dir\vnc.html")) {
            Write-Error "No se encontró vnc.html."
            exit 1
          }

          Write-Host "noVNC instalado."


      # ============================================================
      # WEBSOCKIFY
      # ============================================================

      - name: Instalar websockify
        shell: pwsh
        run: |

          python -m pip install --upgrade pip

          python -m pip install websockify

          $scripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"

          $websockify = Join-Path `
            $scripts `
            "websockify.exe"

          if (-not (Test-Path $websockify)) {
            Write-Error "No se encontró websockify.exe."
            exit 1
          }

          "WEBSOCKIFY=$websockify" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "websockify:"
          Write-Host $websockify


      - name: Iniciar noVNC
        shell: pwsh
        run: |

          $logOut = "C:\noVNC\websockify-out.log"
          $logErr = "C:\noVNC\websockify-err.log"

          $arguments = @(
            "6080",
            "127.0.0.1:5900",
            "--web",
            "C:\noVNC"
          )

          Write-Host "Iniciando websockify..."

          Start-Process `
            -FilePath $env:WEBSOCKIFY `
            -ArgumentList $arguments `
            -RedirectStandardOutput $logOut `
            -RedirectStandardError $logErr `
            -WindowStyle Hidden

          Start-Sleep -Seconds 8

          $web = Get-NetTCPConnection `
            -LocalPort 6080 `
            -ErrorAction SilentlyContinue

          if (-not $web) {

            Write-Host "STDOUT:"
            if (Test-Path $logOut) {
              Get-Content $logOut
            }

            Write-Host ""
            Write-Host "STDERR:"
            if (Test-Path $logErr) {
              Get-Content $logErr
            }

            Write-Error "noVNC no está escuchando en 6080."
            exit 1
          }

          Write-Host "noVNC funcionando."


      # ============================================================
      # CLOUDFLARE
      # ============================================================

      - name: Descargar Cloudflared
        shell: pwsh
        run: |

          $cf = "C:\cloudflared.exe"

          $url = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $cf

          if (-not (Test-Path $cf)) {
            Write-Error "No se pudo descargar Cloudflared."
            exit 1
          }


      - name: Crear túnel público
        shell: pwsh
        run: |

          $cf = "C:\cloudflared.exe"

          $logOut = "C:\cloudflared-out.log"
          $logErr = "C:\cloudflared-err.log"

          Start-Process `
            -FilePath $cf `
            -ArgumentList @(
              "tunnel",
              "--url",
              "http://127.0.0.1:6080"
            ) `
            -RedirectStandardOutput $logOut `
            -RedirectStandardError $logErr `
            -WindowStyle Hidden

          $url = $null

          for ($i = 0; $i -lt 60; $i++) {

            Start-Sleep -Seconds 2

            $text = ""

            if (Test-Path $logOut) {
              $text += Get-Content $logOut -Raw
            }

            if (Test-Path $logErr) {
              $text += Get-Content $logErr -Raw
            }

            $match = [regex]::Match(
              $text,
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
            )

            if ($match.Success) {
              $url = $match.Value
              break
            }
          }

          if (-not $url) {

            Write-Host "Cloudflared STDOUT:"
            if (Test-Path $logOut) {
              Get-Content $logOut
            }

            Write-Host ""
            Write-Host "Cloudflared STDERR:"
            if (Test-Path $logErr) {
              Get-Content $logErr
            }

            Write-Error "No se obtuvo la URL."
            exit 1
          }

          $novncUrl = "$url/vnc.html"

          "NOVNC_URL=$novncUrl" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " WINDOWS CLOUD PC LISTO"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "ABRE ESTA URL EN CHROME:"
          Write-Host ""
          Write-Host $novncUrl
          Write-Host ""
          Write-Host "=============================================="


      # ============================================================
      # MANTENER ACTIVO
      # ============================================================

      - name: Mantener Cloud PC activo
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " CLOUD PC ACTIVO"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "URL:"
          Write-Host $env:NOVNC_URL
          Write-Host ""

          while ($true) {

            Start-Sleep -Seconds 30

            $vncProcess = Get-Process `
              winvnc `
              -ErrorAction SilentlyContinue

            $cloudflaredProcess = Get-Process `
              cloudflared `
              -ErrorAction SilentlyContinue

            $vncPort = Get-NetTCPConnection `
              -LocalPort 5900 `
              -ErrorAction SilentlyContinue

            $webPort = Get-NetTCPConnection `
              -LocalPort 6080 `
              -ErrorAction SilentlyContinue

            if (-not $vncProcess) {
              Write-Error "UltraVNC se cerró."
              exit 1
            }

            if (-not $cloudflaredProcess) {
              Write-Error "Cloudflared se cerró."
              exit 1
            }

            if (-not $vncPort) {
              Write-Error "Puerto VNC 5900 cerrado."
              exit 1
            }

            if (-not $webPort) {
              Write-Error "Puerto noVNC 6080 cerrado."
              exit 1
            }

            Write-Host "$(Get-Date -Format 'HH:mm:ss') - Cloud PC funcionando"
          }
