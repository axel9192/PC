name: Windows Cloud PC

on:
  workflow_dispatch:

jobs:
  cloud-pc:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:

      # ==========================================================
      # WINDOWS
      # ==========================================================

      - name: Preparar Windows
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "        WINDOWS CLOUD PC"
          Write-Host "========================================"

          $theme = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

          New-Item -Path $theme -Force | Out-Null

          Set-ItemProperty `
            -Path $theme `
            -Name "AppsUseLightTheme" `
            -Value 0

          Set-ItemProperty `
            -Path $theme `
            -Name "SystemUsesLightTheme" `
            -Value 0

          Write-Host "[OK] Tema oscuro activado."


      # ==========================================================
      # TIGHTVNC
      # ==========================================================

      - name: Instalar TightVNC
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[1/4] Descargando TightVNC..."

          $installer = "$env:TEMP\tightvnc.msi"

          $url = "https://www.tightvnc.com/download/2.8.90/tightvnc-2.8.90-gpl-setup-64bit.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          if (!(Test-Path $installer)) {
            throw "No se pudo descargar TightVNC."
          }

          Write-Host "[OK] TightVNC descargado."

          $arguments = @(
            "/i"
            "`"$installer`""
            "/quiet"
            "/norestart"

            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"

            "SET_PASSWORD=1"
            "VALUE_OF_PASSWORD=12345678"

            "SET_VIEWONLYPASSWORD=1"
            "VALUE_OF_VIEWONLYPASSWORD=12345678"
          )

          Write-Host "[...] Instalando TightVNC..."

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "TightVNC falló. Código: $($process.ExitCode)"
          }

          Write-Host "[OK] TightVNC instalado."


      # ==========================================================
      # INICIAR TIGHTVNC
      # ==========================================================

      - name: Iniciar TightVNC
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[2/4] Iniciando TightVNC..."

          $server = Get-ChildItem `
            -Path "C:\Program Files" `
            -Filter "tvnserver.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $server) {
            throw "No se encontró tvnserver.exe."
          }

          Write-Host "[OK] $($server.FullName)"

          & $server.FullName -install -silent 2>$null

          Start-Sleep -Seconds 2

          & $server.FullName -start -silent 2>$null

          Start-Sleep -Seconds 5

          $vnc = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 5900 `
            -WarningAction SilentlyContinue

          if (!$vnc.TcpTestSucceeded) {
            Write-Host ""
            Write-Host "===== SERVICIOS VNC ====="

            Get-Service |
              Where-Object {
                $_.Name -like "*Tight*" -or
                $_.DisplayName -like "*TightVNC*"
              } |
              Format-Table -AutoSize

            throw "TightVNC no abrió el puerto 5900."
          }

          Write-Host "[OK] TightVNC escuchando en 5900."


      # ==========================================================
      # PYTHON
      # ==========================================================

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================================
      # NOVNC
      # ==========================================================

      - name: Descargar noVNC
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[3/4] Descargando noVNC..."

          $zip = "$env:TEMP\novnc.zip"

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.7.0.zip" `
            -OutFile $zip

          if (!(Test-Path $zip)) {
            throw "No se pudo descargar noVNC."
          }

          Expand-Archive `
            -Path $zip `
            -DestinationPath "C:\noVNC" `
            -Force

          $novnc = Get-ChildItem `
            -Path "C:\noVNC" `
            -Directory |
            Select-Object -First 1

          if ($null -eq $novnc) {
            throw "No se encontró la carpeta de noVNC."
          }

          Write-Host "[OK] noVNC: $($novnc.FullName)"

          # Guardamos la ruta para el siguiente paso
          "NOVNC_PATH=$($novnc.FullName)" >> $env:GITHUB_ENV


      # ==========================================================
      # WEBSOCKIFY
      # ==========================================================

      - name: Instalar y arrancar Websockify
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[...] Instalando Websockify..."

          python -m pip install --upgrade pip

          python -m pip install websockify==0.13.0

          Write-Host "[OK] Websockify instalado."

          Write-Host ""
          Write-Host "[...] Comprobando Websockify..."

          websockify --help | Select-Object -First 5

          Write-Host ""
          Write-Host "[...] Iniciando Websockify..."

          $log = "C:\websockify.log"

          $arguments = @(
            "--verbose"
            "--allow-loopback"
            "--web"
            "`"$env:NOVNC_PATH`""
            "6080"
            "127.0.0.1:5900"
          )

          Start-Process `
            -FilePath "websockify" `
            -ArgumentList $arguments `
            -RedirectStandardOutput $log `
            -RedirectStandardError $log `
            -WindowStyle Hidden

          Start-Sleep -Seconds 8

          Write-Host ""
          Write-Host "===== WEBSOCKIFY LOG ====="

          if (Test-Path $log) {
            Get-Content $log
          }

          Write-Host ""
          Write-Host "===== PUERTO 6080 ====="

          $web = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 6080 `
            -WarningAction SilentlyContinue

          if (!$web.TcpTestSucceeded) {
            throw "Websockify no abrió el puerto 6080. Revisa el log anterior."
          }

          Write-Host "[OK] Websockify escuchando en 6080."


      # ==========================================================
      # CLOUDFLARE
      # ==========================================================

      - name: Iniciar Cloudflare
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[4/4] Creando conexión pública..."

          $cloudflared = "C:\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared

          if (!(Test-Path $cloudflared)) {
            throw "No se pudo descargar Cloudflared."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "          CLOUD PC LISTO"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Abre la URL trycloudflare.com que aparezca."
          Write-Host ""
          Write-Host "Después entra en:"
          Write-Host "https://TU-URL.trycloudflare.com/vnc.html"
          Write-Host ""
          Write-Host "Contraseña VNC:"
          Write-Host "12345678"
          Write-Host ""
          Write-Host "========================================"

          & $cloudflared tunnel `
            --no-autoupdate `
            --protocol http2 `
            --url "http://127.0.0.1:6080"


      # ==========================================================
      # MANTENER EJECUTANDO
      # ==========================================================

      - name: Mantener PC activa
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "       CLOUD PC EN EJECUCION"
          Write-Host "========================================"

          while ($true) {
            Write-Host "PC activa - $(Get-Date -Format 'HH:mm:ss')"
            Start-Sleep -Seconds 60
          }
