name: Windows Cloud PC - Scream + UltraVNC + noVNC + Cloudflare

on:
  workflow_dispatch:

jobs:
  cloud-pc:
    name: Iniciando Cloud PC
    runs-on: windows-2025
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. AUDIO
      # ============================================================

      - name: Iniciar servicios de audio
        shell: pwsh
        run: |
          Start-Service AudioEndpointBuilder -ErrorAction SilentlyContinue
          Start-Service Audiosrv -ErrorAction SilentlyContinue

          Set-Service AudioEndpointBuilder -StartupType Automatic -ErrorAction SilentlyContinue
          Set-Service Audiosrv -StartupType Automatic -ErrorAction SilentlyContinue


      # ============================================================
      # 2. SCREAM
      # ============================================================

      - name: Descargar Scream
        shell: pwsh
        run: |
          $zip = "C:\Scream3.6.zip"
          $dir = "C:\Scream"

          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue

          Invoke-WebRequest `
            -Uri "https://github.com/duncanthrax/scream/releases/download/3.6/Scream3.6.zip" `
            -OutFile $zip

          if (-not (Test-Path $zip)) {
            throw "No se pudo descargar Scream."
          }

          Expand-Archive `
            -Path $zip `
            -DestinationPath $dir `
            -Force

          Write-Host "Scream descargado."


      - name: Instalar Scream
        shell: pwsh
        run: |
          $inf = "C:\Scream\Install\driver\Scream.inf"
          $devcon = "C:\Scream\Install\helpers\devcon.exe"

          if (-not (Test-Path $inf)) {
            throw "No existe Scream.inf."
          }

          if (-not (Test-Path $devcon)) {
            throw "No existe devcon.exe."
          }

          & $devcon install $inf "*Scream"

          if ($LASTEXITCODE -ne 0) {
            throw "La instalación de Scream falló."
          }

          Start-Sleep -Seconds 5

          Start-Service AudioEndpointBuilder -ErrorAction SilentlyContinue
          Start-Service Audiosrv -ErrorAction SilentlyContinue

          Write-Host "Scream instalado."


      # ============================================================
      # 3. ULTRAVNC
      # ============================================================

      - name: Descargar UltraVNC
        shell: pwsh
        run: |
          $installer = "C:\UltraVNC_Setup.exe"

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          Invoke-WebRequest `
            -Uri "https://uvnc.eu/download/1800/UltraVNC_1806_x64_Setup.exe" `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            throw "No se pudo descargar UltraVNC."
          }


      - name: Instalar UltraVNC
        shell: pwsh
        run: |
          $installer = "C:\UltraVNC_Setup.exe"

          $p = Start-Process `
            -FilePath $installer `
            -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" `
            -Wait `
            -PassThru

          if ($p.ExitCode -ne 0) {
            throw "La instalación de UltraVNC falló."
          }

          Start-Sleep -Seconds 3


      # ============================================================
      # 4. CONFIGURAR ULTRAVNC
      # ============================================================

      - name: Configurar UltraVNC y contraseña
        shell: pwsh
        run: |
          $vncDirs = @(
            "C:\Program Files\uvnc bvba\UltraVNC",
            "C:\Program Files\UltraVNC"
          )

          $vncDir = $null

          foreach ($dir in $vncDirs) {
            if (Test-Path (Join-Path $dir "winvnc.exe")) {
              $vncDir = $dir
              break
            }
          }

          if ($null -eq $vncDir) {
            throw "No se encontró winvnc.exe."
          }

          $programDataDir = "$env:ProgramData\UltraVNC"

          New-Item `
            -ItemType Directory `
            -Path $programDataDir `
            -Force | Out-Null

          $ini = Join-Path $programDataDir "ultravnc.ini"

          $config = @(
            "[ultravnc]",
            "passwd=",
            "passwd2=",
            "",
            "[admin]",
            "UseRegistry=0",
            "MSLogonRequired=0",
            "NewMSLogon=0",
            "AuthRequired=1",
            "SocketConnect=1",
            "AllowLoopback=1",
            "LoopbackOnly=0",
            "InputsEnabled=1",
            "LocalInputsDisabled=0",
            "AllowShutdown=1",
            "AllowProperties=1",
            "AllowEditClients=1",
            "FileTransferEnabled=1",
            "UseDSMPlugin=0",
            "PortNumber=5900",
            "AutoPortSelect=0",
            "HTTPConnect=0"
          )

          $config | Set-Content `
            -Path $ini `
            -Encoding ASCII

          Write-Host "Configuración creada en:"
          Write-Host $ini


      # ============================================================
      # 5. DESCARGAR HERRAMIENTA DE CONTRASEÑA
      # ============================================================

      - name: Instalar herramienta de contraseña UltraVNC
        shell: pwsh
        run: |
          $zip = "C:\createpassword.zip"
          $dir = "C:\createpassword"

          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Remove-Item $dir -Recurse -Force -ErrorAction SilentlyContinue

          Invoke-WebRequest `
            -Uri "https://uvnc.eu/download/133/createpassword.zip" `
            -OutFile $zip

          Expand-Archive `
            -Path $zip `
            -DestinationPath $dir `
            -Force

          $tool = Get-ChildItem `
            -Path $dir `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -ieq "createpassword64.exe" -or
              $_.Name -ieq "setpasswd.exe"
            } |
            Select-Object -First 1

          if ($null -eq $tool) {
            throw "No se encontró createpassword64.exe/setpasswd.exe."
          }

          Copy-Item `
            $tool.FullName `
            "$env:ProgramData\UltraVNC\" `
            -Force

          Write-Host "Herramienta de contraseña instalada."


      # ============================================================
      # 6. ESTABLECER CONTRASEÑA VNC
      # ============================================================

      - name: Establecer contraseña VNC
        shell: pwsh
        run: |
          $password = "12345678"
          $dir = "$env:ProgramData\UltraVNC"

          $create64 = Join-Path $dir "createpassword64.exe"
          $setpasswd = Join-Path $dir "setpasswd.exe"

          Set-Location $dir

          if (Test-Path $create64) {
            & $create64 $password
          }
          elseif (Test-Path $setpasswd) {
            & $setpasswd $password
          }
          else {
            throw "No existe la herramienta de contraseña."
          }

          Start-Sleep -Seconds 2

          if (-not (Test-Path "$dir\ultravnc.ini")) {
            throw "No existe ultravnc.ini después de establecer la contraseña."
          }

          Write-Host "Contraseña VNC establecida."


      # ============================================================
      # 7. FIREWALL VNC
      # ============================================================

      - name: Configurar firewall VNC
        shell: pwsh
        run: |
          Remove-NetFirewallRule `
            -DisplayName "UltraVNC 5900" `
            -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "UltraVNC 5900" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 5900 `
            -Action Allow `
            -Profile Any `
            -ErrorAction SilentlyContinue


      # ============================================================
      # 8. INICIAR ULTRAVNC
      # ============================================================

      - name: Iniciar UltraVNC
        shell: pwsh
        run: |
          $vncDirs = @(
            "C:\Program Files\uvnc bvba\UltraVNC",
            "C:\Program Files\UltraVNC"
          )

          $winvnc = $null

          foreach ($dir in $vncDirs) {
            $candidate = Join-Path $dir "winvnc.exe"

            if (Test-Path $candidate) {
              $winvnc = $candidate
              break
            }
          }

          if ($null -eq $winvnc) {
            throw "winvnc.exe no encontrado."
          }

          Get-Process winvnc -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

          Start-Process `
            -FilePath $winvnc `
            -WorkingDirectory (Split-Path $winvnc)

          Start-Sleep -Seconds 5

          Write-Host "UltraVNC iniciado."


      # ============================================================
      # 9. INSTALAR WEBSOCKIFY
      # ============================================================

      - name: Instalar websockify
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install websockify


      # ============================================================
      # 10. DESCARGAR NOVNC
      # ============================================================

      - name: Descargar noVNC
        shell: pwsh
        run: |
          $dir = "C:\noVNC"

          Remove-Item `
            $dir `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          git clone `
            --depth 1 `
            "https://github.com/novnc/noVNC.git" `
            $dir

          if (-not (Test-Path "$dir\vnc.html")) {
            throw "noVNC no se descargó correctamente."
          }

          Write-Host "noVNC instalado."


      # ============================================================
      # 11. INICIAR NOVNC
      # ============================================================

      - name: Iniciar noVNC
        shell: pwsh
        run: |
          $command = Get-Command websockify.exe -ErrorAction SilentlyContinue

          if ($null -eq $command) {
            $command = Get-Command websockify -ErrorAction SilentlyContinue
          }

          if ($null -eq $command) {
            throw "websockify no está disponible."
          }

          Start-Process `
            -FilePath $command.Source `
            -ArgumentList @(
              "6080",
              "127.0.0.1:5900",
              "--web",
              "C:\noVNC"
            ) `
            -WorkingDirectory "C:\noVNC"

          Start-Sleep -Seconds 5

          Write-Host "noVNC iniciado en http://127.0.0.1:6080"
            # ============================================================
      # 12. DESCARGAR CLOUDFLARED
      # ============================================================

      - name: Descargar Cloudflared
        shell: pwsh
        run: |
          $cloudflared = "C:\cloudflared.exe"

          Remove-Item `
            $cloudflared `
            -Force `
            -ErrorAction SilentlyContinue

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared

          if (-not (Test-Path $cloudflared)) {
            throw "No se pudo descargar cloudflared."
          }

          Write-Host "Cloudflared descargado."


      # ============================================================
      # 13. CLOUDFLARE QUICK TUNNEL
      # ============================================================

      - name: Iniciar Cloudflare Quick Tunnel
        shell: pwsh
        run: |
          $cloudflared = "C:\cloudflared.exe"

          $stdout = "C:\cloudflared_stdout.txt"
          $stderr = "C:\cloudflared_stderr.txt"

          Remove-Item $stdout -Force -ErrorAction SilentlyContinue
          Remove-Item $stderr -Force -ErrorAction SilentlyContinue

          $process = Start-Process `
            -FilePath $cloudflared `
            -ArgumentList @(
              "tunnel",
              "--no-autoupdate",
              "--url",
              "http://127.0.0.1:6080"
            ) `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -WindowStyle Hidden `
            -PassThru

          $url = $null

          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1

            $text = ""

            if (Test-Path $stdout) {
              $text += Get-Content `
                $stdout `
                -Raw `
                -ErrorAction SilentlyContinue
            }

            if (Test-Path $stderr) {
              $text += Get-Content `
                $stderr `
                -Raw `
                -ErrorAction SilentlyContinue
            }

            $match = [regex]::Match(
              $text,
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
            )

            if ($match.Success) {
              $url = $match.Value
              break
            }

            if ($process.HasExited) {
              throw "Cloudflared terminó antes de crear el túnel."
            }
          }

          if ([string]::IsNullOrWhiteSpace($url)) {
            throw "No se pudo obtener la URL de Cloudflare."
          }

          Write-Host ""
          Write-Host "================================================"
          Write-Host "             CLOUD PC LISTO"
          Write-Host "================================================"
          Write-Host ""
          Write-Host "URL:"
          Write-Host $url
          Write-Host ""
          Write-Host "CONTRASEÑA VNC:"
          Write-Host "12345678"
          Write-Host ""
          Write-Host "================================================"
          Write-Host ""

          # Mantener el túnel activo.
          while (-not $process.HasExited) {
            Start-Sleep -Seconds 10
          }

          throw "Cloudflared se detuvo."


      # ============================================================
      # 14. MANTENER EL WORKFLOW
      # ============================================================

      - name: Mantener Cloud PC activo
        if: always()
        shell: pwsh
        run: |
          while ($true) {
            Start-Sleep -Seconds 300
          }
