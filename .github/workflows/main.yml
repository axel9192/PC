name: Windows Cloud PC

on:
  workflow_dispatch:

jobs:
  cloud:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:

      - name: Descargar UltraVNC
        shell: pwsh
        run: |
          $zip = "$env:TEMP\UltraVNC.zip"

          Invoke-WebRequest `
            "https://uvnc.eu/download/1800/UltraVNC_1830.zip" `
            -OutFile $zip

          Expand-Archive `
            $zip `
            "C:\UltraVNC" `
            -Force

      - name: Configurar contraseña e iniciar UltraVNC
        shell: pwsh
        run: |
          $vnc = Get-ChildItem `
            "C:\UltraVNC" `
            -Filter winvnc.exe `
            -Recurse |
            Select-Object -First 1

          if (!$vnc) {
            throw "No se encontró winvnc.exe"
          }

          $dir = $vnc.DirectoryName

          New-Item `
            "C:\ProgramData\UltraVNC" `
            -ItemType Directory `
            -Force | Out-Null

          Copy-Item `
            "$dir\ultravnc.ini" `
            "C:\ProgramData\UltraVNC\ultravnc.ini" `
            -Force `
            -ErrorAction SilentlyContinue

          $cp = "$env:TEMP\createpassword.zip"

          Invoke-WebRequest `
            "https://uvnc.eu/download/133/createpassword.zip" `
            -OutFile $cp

          Expand-Archive `
            $cp `
            "$env:TEMP\createpassword" `
            -Force

          $tool = Get-ChildItem `
            "$env:TEMP\createpassword" `
            -Filter createpassword64.exe `
            -Recurse |
            Select-Object -First 1

          if (!$tool) {
            throw "No se encontró createpassword64.exe"
          }

          Push-Location "C:\ProgramData\UltraVNC"

          & $tool.FullName secure 1
          & $tool.FullName secure 12345678

          Pop-Location

          Start-Process $vnc.FullName

          Start-Sleep -Seconds 5

      - name: Intentar instalar Scream
        shell: pwsh
        continue-on-error: true
        run: |
          $zip = "$env:TEMP\Scream.zip"

          Invoke-WebRequest `
            "https://github.com/duncanthrax/scream/releases/download/4.0/Scream-4.0.zip" `
            -OutFile $zip

          Expand-Archive `
            $zip `
            "C:\Scream" `
            -Force

          $inf = Get-ChildItem `
            "C:\Scream" `
            -Filter Scream.inf `
            -Recurse |
            Select-Object -First 1

          if ($inf) {
            pnputil /add-driver $inf.FullName /install
          }

      - name: Iniciar Cloudflare
        shell: pwsh
        run: |
          $cf = "C:\cloudflared.exe"

          Invoke-WebRequest `
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cf

          & $cf tunnel `
            --protocol http2 `
            --url http://127.0.0.1:5800
