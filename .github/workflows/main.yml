name: Windows Cloud PC - Scream + UltraVNC + noVNC

on:
  workflow_dispatch:

jobs:
  cloud-pc:
    name: Windows Cloud PC
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      VNC_PORT: 5900
      NOVNC_PORT: 6080

    steps:

      # ============================================================
      # AUDIO
      # ============================================================

      - name: Iniciar servicios de audio
        shell: pwsh
        run: |
          Write-Host "Iniciando servicios de audio..."

          Start-Service AudioEndpointBuilder -ErrorAction SilentlyContinue
          Start-Service Audiosrv -ErrorAction SilentlyContinue

          Get-Service AudioEndpointBuilder,Audiosrv |
            Format-Table Name,Status,StartType


      - name: Comprobar audio inicial
        shell: pwsh
        run: |
          Write-Host "Dispositivos de audio actuales:"

          Get-CimInstance Win32_SoundDevice |
            Select-Object Name,Status,Manufacturer |
            Format-Table -AutoSize


      # ============================================================
      # SCREAM
      # ============================================================

      - name: Descargar Scream
        shell: pwsh
        run: |
          $url = "https://github.com/duncanthrax/scream/releases/download/3.6/Scream3.6.zip"
          $zip = "C:\Scream3.6.zip"
          $dir = "C:\Scream"

          if (Test-Path $dir) {
            Remove-Item $dir -Recurse -Force
          }

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $zip

          Expand-Archive `
            -Path $zip `
            -DestinationPath $dir `
            -Force

          Write-Host "Scream descargado."


      - name: Comprobar archivos Scream
        shell: pwsh
        run: |
          $sys = "C:\Scream\Install\driver\Scream.sys"
          $inf = "C:\Scream\Install\driver\Scream.inf"
          $devcon = "C:\Scream\Install\helpers\devcon.exe"

          if (-not (Test-Path $sys)) {
            Write-Error "No se encontró Scream.sys"
            exit 1
          }

          if (-not (Test-Path $inf)) {
            Write-Error "No se encontró Scream.inf"
            exit 1
          }

          if (-not (Test-Path $devcon)) {
            Write-Error "No se encontró devcon.exe"
            exit 1
          }

          Write-Host "Archivos de Scream encontrados."


      - name: Instalar certificado Scream
        shell: pwsh
        run: |
          $sys = "C:\Scream\Install\driver\Scream.sys"

          $signature = Get-AuthenticodeSignature $sys

          if ($signature.SignerCertificate) {

            Write-Host "Instalando certificado..."

            $cert = $signature.SignerCertificate

            $store = New-Object `
              System.Security.Cryptography.X509Certificates.X509Store(
                "TrustedPublisher",
                "LocalMachine"
              )

            $store.Open(
              [System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite
            )

            $store.Add($cert)

            $store.Close()

          } else {

            Write-Host "No se encontró certificado del controlador."

          }


      - name: Instalar driver Scream
        shell: pwsh
        run: |
          $inf = "C:\Scream\Install\driver\Scream.inf"
          $devcon = "C:\Scream\Install\helpers\devcon.exe"

          Write-Host "Instalando dispositivo Scream..."

          & $devcon install $inf "*Scream"

          Start-Sleep -Seconds 5

          Start-Service AudioEndpointBuilder `
            -ErrorAction SilentlyContinue

          Start-Service Audiosrv `
            -ErrorAction SilentlyContinue


      - name: Comprobar audio final
        shell: pwsh
        run: |
          Write-Host "Dispositivos de audio después de instalar Scream:"

          Get-CimInstance Win32_SoundDevice |
            Select-Object Name,Status,Manufacturer |
            Format-Table -AutoSize


      # ============================================================
      # ULTRAVNC
      # ============================================================

      - name: Descargar UltraVNC 1.8.2.4
        shell: pwsh
        run: |

          $installer = "C:\UltraVNC_1824_x64_Setup.exe"

          $url = `
            "https://uvnc.eu/download/1800/UltraVNC_1824_x64_Setup.exe"

          Write-Host "Descargando UltraVNC 1.8.2.4 x64..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
            Write-Error "No se pudo descargar UltraVNC."
            exit 1
          }

          Write-Host "UltraVNC descargado correctamente."


      - name: Crear configuración de instalación UltraVNC
        shell: pwsh
        run: |

          $inf = "C:\uvnc-install.inf"

          @"
          [Setup]
          Lang=en
          Dir=C:\Program Files\UltraVNC
          Group=UltraVNC
          NoIcons=1
          SetupType=server_silent
          Components=ultravnc_server
          "@ | Out-File `
            -FilePath $inf `
            -Encoding ascii

          Write-Host "Archivo de instalación creado."


      - name: Instalar UltraVNC
        shell: pwsh
        run: |

          $installer = "C:\UltraVNC_1824_x64_Setup.exe"
          $inf = "C:\uvnc-install.inf"

          Write-Host "Instalando UltraVNC..."

          $arguments = @(
            "/SP-",
            "/VERYSILENT",
            "/NORESTART",
            "/LOADINF=$inf"
          )

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host "Código de instalación: $($process.ExitCode)"

          Start-Sleep -Seconds 5

          $uvnc = "C:\Program Files\UltraVNC"

          if (-not (Test-Path "$uvnc\winvnc.exe")) {

            Write-Host "No se encontró winvnc.exe en Program Files."

            Get-ChildItem `
              "C:\Program Files" `
              -Filter "winvnc.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue

            exit 1
          }

          Write-Host "UltraVNC instalado."


      # ============================================================
      # CONFIGURACIÓN VNC
      # ============================================================

      - name: Configurar contraseña y UltraVNC
        shell: pwsh
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |

          if ([string]::IsNullOrWhiteSpace($env:VNC_PASSWORD)) {
            Write-Error "Falta el secret VNC_PASSWORD."
            exit 1
          }

          if ($env:VNC_PASSWORD.Length -gt 8) {
            Write-Error "VNC_PASSWORD debe tener máximo 8 caracteres."
            exit 1
          }

          $programData = "$env:ProgramData\UltraVNC"

          New-Item `
            -ItemType Directory `
            -Path $programData `
            -Force | Out-Null

          $ini = Join-Path `
            $programData `
            "ultravnc.ini"

          @"
          [admin]
          UseRegistry=0
          MSLogonRequired=0
          NewMSLogon=0
          AuthRequired=1
          AllowLoopback=1
          LoopbackOnly=0
          SocketConnect=1
          HTTPConnect=0
          AutoPortSelect=0
          PortNumber=5900
          DisableTrayIcon=1
          InputsEnabled=1
          FileTransferEnabled=0
          QuerySetting=0
          QueryAccept=0
          DebugMode=0
          "@ | Out-File `
            -FilePath $ini `
            -Encoding ascii

          Write-Host "Configuración creada en:"
          Write-Host $ini

          # Buscar herramienta de contraseña instalada
          $setpasswd = Get-ChildItem `
            "C:\Program Files\UltraVNC" `
            -Filter "setpasswd.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $createpassword = Get-ChildItem `
            "C:\Program Files\UltraVNC" `
            -Filter "createpassword.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($setpasswd) {

            Write-Host "Usando setpasswd.exe"

            Set-Location $programData

            & $setpasswd.FullName $env:VNC_PASSWORD

            if ($LASTEXITCODE -ne 0) {
              Write-Error "setpasswd.exe falló."
              exit 1
            }

          }
          elseif ($createpassword) {

            Write-Host "Usando createpassword.exe"

            Set-Location $programData

            & $createpassword.FullName $env:VNC_PASSWORD

            if ($LASTEXITCODE -ne 0) {
              Write-Error "createpassword.exe falló."
              exit 1
            }

          }
          else {

            Write-Error `
              "No se encontró setpasswd.exe ni createpassword.exe."

            Write-Host "Contenido de Program Files\UltraVNC:"

            Get-ChildItem `
              "C:\Program Files\UltraVNC" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object FullName

            exit 1
          }

          if (-not (Test-Path $ini)) {
            Write-Error "No se creó ultravnc.ini."
            exit 1
          }

          Write-Host "Configuración UltraVNC lista."


      # ============================================================
      # FIREWALL
      # ============================================================

      - name: Abrir puertos locales
        shell: pwsh
        run: |

          New-NetFirewallRule `
            -DisplayName "UltraVNC 5900" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 5900 `
            -Action Allow `
            -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "noVNC 6080" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 6080 `
            -Action Allow `
            -ErrorAction SilentlyContinue


      # ============================================================
      # INICIAR ULTRAVNC
      # ============================================================

      - name: Iniciar UltraVNC
        shell: pwsh
        run: |

          $uvnc = "C:\Program Files\UltraVNC"
          $winvnc = "$uvnc\winvnc.exe"

          if (-not (Test-Path $winvnc)) {
            Write-Error "winvnc.exe no existe."
            exit 1
          }

          Write-Host "Iniciando servidor UltraVNC..."

          Start-Process `
            -FilePath $winvnc `
            -WorkingDirectory $uvnc

          Start-Sleep -Seconds 10

          Write-Host "Procesos UltraVNC:"

          Get-Process winvnc `
            -ErrorAction SilentlyContinue

          Write-Host "Puerto 5900:"

          Get-NetTCPConnection `
            -LocalPort 5900 `
            -ErrorAction SilentlyContinue |
            Format-Table -AutoSize

          $vnc = Get-NetTCPConnection `
            -LocalPort 5900 `
            -ErrorAction SilentlyContinue

          if (-not $vnc) {

            Write-Error `
              "UltraVNC no está escuchando en el puerto 5900."

            exit 1
          }

          Write-Host "UltraVNC funcionando."


      # ============================================================
      # NOVNC
      # ============================================================

      - name: Descargar noVNC
        shell: pwsh
        run: |

          $dir = "C:\noVNC"

          if (Test-Path $dir) {
            Remove-Item `
              $dir `
              -Recurse `
              -Force
          }

          git clone `
            --depth 1 `
            https://github.com/novnc/noVNC.git `
            $dir

          if (-not (Test-Path "$dir\vnc.html")) {
            Write-Error "No se encontró vnc.html."
            exit 1
          }

          Write-Host "noVNC descargado."


      # ============================================================
      # WEBSOCKIFY
      # ============================================================

      - name: Instalar websockify
        shell: pwsh
        run: |

          python -m pip install --upgrade pip

          python -m pip install websockify

          $scripts = python -c `
            "import sysconfig; print(sysconfig.get_path('scripts'))"

          $websockify = Join-Path `
            $scripts `
            "websockify.exe"

          if (-not (Test-Path $websockify)) {

            Write-Error `
              "No se encontró websockify.exe."

            exit 1
          }

          "WEBSOCKIFY=$websockify" |
            Out-File `
              $env:GITHUB_ENV `
              -Append

          Write-Host "websockify: $websockify"


      # ============================================================
      # INICIAR NOVNC
      # ============================================================

      - name: Iniciar noVNC
        shell: pwsh
        run: |

          $logOut = "C:\noVNC\websockify-out.log"
          $logErr = "C:\noVNC\websockify-err.log"

          $arguments = @(
            "6080",
            "127.0.0.1:5900",
            "--web",
            "C:\noVNC"
          )

          Write-Host "Iniciando websockify/noVNC..."

          Start-Process `
            -FilePath $env:WEBSOCKIFY `
            -ArgumentList $arguments `
            -RedirectStandardOutput $logOut `
            -RedirectStandardError $logErr `
            -WindowStyle Hidden

          Start-Sleep -Seconds 8

          $connection = Get-NetTCPConnection `
            -LocalPort 6080 `
            -ErrorAction SilentlyContinue

          if (-not $connection) {

            Write-Host "STDOUT:"
            if (Test-Path $logOut) {
              Get-Content $logOut
            }

            Write-Host "STDERR:"
            if (Test-Path $logErr) {
              Get-Content $logErr
            }

            Write-Error `
              "noVNC/websockify no está escuchando en 6080."

            exit 1
          }

          Write-Host "noVNC funcionando."


      # ============================================================
      # CLOUDFLARE TUNNEL
      # ============================================================

      - name: Descargar Cloudflared
        shell: pwsh
        run: |

          $cf = "C:\cloudflared.exe"

          $url = `
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"

          Write-Host "Descargando Cloudflared..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $cf

          if (-not (Test-Path $cf)) {

            Write-Error `
              "No se pudo descargar cloudflared."

            exit 1
          }


      - name: Crear URL pública de noVNC
        shell: pwsh
        run: |

          $cf = "C:\cloudflared.exe"

          $logOut = "C:\cloudflared-out.log"
          $logErr = "C:\cloudflared-err.log"

          Write-Host "Creando túnel público..."

          Start-Process `
            -FilePath $cf `
            -ArgumentList @(
              "tunnel",
              "--url",
              "http://127.0.0.1:6080"
            ) `
            -RedirectStandardOutput $logOut `
            -RedirectStandardError $logErr `
            -WindowStyle Hidden

          $url = $null

          for ($i = 0; $i -lt 60; $i++) {

            Start-Sleep -Seconds 2

            $text = ""

            if (Test-Path $logOut) {
              $text += Get-Content $logOut -Raw
            }

            if (Test-Path $logErr) {
              $text += Get-Content $logErr -Raw
            }

            $match = [regex]::Match(
              $text,
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
            )

            if ($match.Success) {

              $url = $match.Value
              break
            }
          }

          if (-not $url) {

            Write-Host "Cloudflared STDOUT:"
            if (Test-Path $logOut) {
              Get-Content $logOut
            }

            Write-Host "Cloudflared STDERR:"
            if (Test-Path $logErr) {
              Get-Content $logErr
            }

            Write-Error `
              "No se pudo obtener la URL pública."

            exit 1
          }

          $novncUrl = "$url/vnc.html"

          "NOVNC_URL=$novncUrl" |
            Out-File `
              $env:GITHUB_ENV `
              -Append

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " URL DE NOVNC:"
          Write-Host $novncUrl
          Write-Host "=============================================="
          Write-Host ""


      # ============================================================
      # INFORMACIÓN FINAL
      # ============================================================

      - name: Mostrar información de conexión
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       WINDOWS CLOUD PC LISTO"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Abre esta URL en Chrome:"
          Write-Host ""
          Write-Host $env:NOVNC_URL
          Write-Host ""
          Write-Host "En noVNC pulsa Connect."
          Write-Host "Puerto VNC interno: 5900"
          Write-Host "Web noVNC: 6080"
          Write-Host ""
          Write-Host "=============================================="


      # ============================================================
      # MANTENER ACTIVO
      # ============================================================

      - name: Mantener Cloud PC activo
        shell: pwsh
        run: |

          Write-Host "Cloud PC activo."

          while ($true) {

            Start-Sleep -Seconds 30

            $vnc = Get-Process `
              winvnc `
              -ErrorAction SilentlyContinue

            $cloudflared = Get-Process `
              cloudflared `
              -ErrorAction SilentlyContinue

            $vncPort = Get-NetTCPConnection `
              -LocalPort 5900 `
              -ErrorAction SilentlyContinue

            $webPort = Get-NetTCPConnection `
              -LocalPort 6080 `
              -ErrorAction SilentlyContinue

            if (-not $vnc) {
              Write-Error "UltraVNC se cerró."
              exit 1
            }

            if (-not $cloudflared) {
              Write-Error "Cloudflared se cerró."
              exit 1
            }

            if (-not $vncPort) {
              Write-Error "Puerto 5900 dejó de estar activo."
              exit 1
            }

            if (-not $webPort) {
              Write-Error "Puerto 6080 dejó de estar activo."
              exit 1
            }

            Write-Host `
              "$(Get-Date -Format 'HH:mm:ss') - VNC + noVNC + túnel OK"
          }
