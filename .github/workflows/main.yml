name: Windows Cloud PC

on:
  workflow_dispatch:

jobs:
  cloud-pc:
    runs-on: windows-2025
    timeout-minutes: 360

    steps:

      - name: Preparar Windows
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "       WINDOWS CLOUD PC"
          Write-Host "========================================"

          $theme = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

          New-Item -Path $theme -Force | Out-Null

          Set-ItemProperty `
            -Path $theme `
            -Name "AppsUseLightTheme" `
            -Value 0

          Set-ItemProperty `
            -Path $theme `
            -Name "SystemUsesLightTheme" `
            -Value 0

          Write-Host "[OK] Tema oscuro activado."

      - name: Instalar TightVNC
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[1/4] Descargando TightVNC 2.8.90..."

          $installer = "$env:TEMP\tightvnc.msi"

          $url = "https://www.tightvnc.com/download/2.8.90/tightvnc-2.8.90-gpl-setup-64bit.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          if (!(Test-Path $installer)) {
            throw "No se pudo descargar TightVNC."
          }

          $size = (Get-Item $installer).Length

          Write-Host "[OK] Instalador descargado."
          Write-Host "[OK] Tamaño: $size bytes"

          if ($size -lt 1000000) {
            throw "El archivo descargado parece incorrecto."
          }

          Write-Host ""
          Write-Host "[...] Instalando TightVNC..."

          $arguments = @(
            "/i"
            "`"$installer`""
            "/quiet"
            "/norestart"

            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"

            "SET_PASSWORD=1"
            "VALUE_OF_PASSWORD=12345678"

            "SET_VIEWONLYPASSWORD=1"
            "VALUE_OF_VIEWONLYPASSWORD=12345678"
          )

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "La instalación de TightVNC falló. Código: $($process.ExitCode)"
          }

          Write-Host "[OK] TightVNC instalado."
          Write-Host "[OK] Contraseña VNC configurada."

      - name: Iniciar TightVNC
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[2/4] Iniciando servidor VNC..."

          $server = Get-ChildItem `
            -Path "C:\Program Files" `
            -Filter "tvnserver.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $server) {
            throw "No se encontró tvnserver.exe."
          }

          Write-Host "[OK] Servidor:"
          Write-Host $server.FullName

          Write-Host "[...] Instalando/iniciando servicio..."

          & $server.FullName -install -silent 2>$null
          & $server.FullName -start -silent

          Start-Sleep -Seconds 5

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 5900 `
            -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
            throw "TightVNC no está escuchando en el puerto 5900."
          }

          Write-Host "[OK] TightVNC activo en 5900."

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar noVNC y Websockify
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[3/4] Preparando noVNC + Websockify..."

          $novncZip = "$env:TEMP\novnc.zip"

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.7.0.zip" `
            -OutFile $novncZip

          Expand-Archive `
            -Path $novncZip `
            -DestinationPath "C:\noVNC" `
            -Force

          $novnc = Get-ChildItem `
            -Path "C:\noVNC" `
            -Directory |
            Select-Object -First 1

          if ($null -eq $novnc) {
            throw "No se encontró noVNC."
          }

          Write-Host "[OK] noVNC encontrado:"
          Write-Host $novnc.FullName

          Write-Host "[...] Instalando Websockify..."

          python -m pip install --upgrade pip
          python -m pip install websockify==0.13.0

          Write-Host "[OK] Websockify instalado."

          Write-Host "[...] Iniciando puente VNC..."

          Start-Process `
          -FilePath "python" `
          -ArgumentList @(
          "-m"
          "websockify"
          "--allow-loopback"
          "6080"
          "127.0.0.1:5900"
          "--web"
          $novnc.FullName
          )

          Start-Sleep -Seconds 5

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 6080 `
            -WarningAction SilentlyContinue

          if (-not $test.TcpTestSucceeded) {
            throw "Websockify no está escuchando en 6080."
          }

          Write-Host "[OK] noVNC/Websockify activo."
          Write-Host "[OK] Puerto web: 6080"

      - name: Iniciar Cloudflare
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "[4/4] Creando conexión pública..."

          $cloudflared = "C:\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared

          if (!(Test-Path $cloudflared)) {
            throw "No se pudo descargar Cloudflared."
          }

          Write-Host "[OK] Cloudflared descargado."
          Write-Host ""
          Write-Host "========================================"
          Write-Host "          CLOUD PC LISTO"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "ESPERA A QUE APAREZCA LA URL:"
          Write-Host ""
          Write-Host "https://xxxxx.trycloudflare.com"
          Write-Host ""
          Write-Host "Luego abre:"
          Write-Host "https://xxxxx.trycloudflare.com/vnc.html"
          Write-Host ""
          Write-Host "========================================"
          Write-Host ""

          & $cloudflared tunnel `
            --no-autoupdate `
            --protocol http2 `
            --url "http://127.0.0.1:6080"

      - name: Mantener PC activa
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "       CLOUD PC EN EJECUCION"
          Write-Host "========================================"

          while ($true) {
            Write-Host "PC activa - $(Get-Date -Format 'HH:mm:ss')"
            Start-Sleep -Seconds 60
          }
