name: Windows Cloud PC - TightVNC + noVNC + Cloudflare

on:
  workflow_dispatch:

jobs:
  cloud-pc:

    runs-on: windows-2025
    timeout-minutes: 360

    env:
      VNC_PASSWORD: "12345678"
      VNC_PORT: "5900"
      NOVNC_PORT: "6080"

    steps:

      # ============================================================
      # WINDOWS
      # ============================================================

      - name: Configurar Windows
        shell: pwsh
        run: |

          $theme = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

          New-Item -Path $theme -Force | Out-Null

          Set-ItemProperty `
            -Path $theme `
            -Name AppsUseLightTheme `
            -Value 0

          Set-ItemProperty `
            -Path $theme `
            -Name SystemUsesLightTheme `
            -Value 0

          powercfg /hibernate off

          powercfg /change standby-timeout-ac 0
          powercfg /change monitor-timeout-ac 0

          Write-Host "[OK] Windows configurado."


      # ============================================================
      # PYTHON
      # ============================================================

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # TIGHTVNC
      # ============================================================

      - name: Instalar TightVNC
        shell: pwsh
        run: |

          $installer = "$env:TEMP\tightvnc.msi"

          Invoke-WebRequest `
            -Uri "https://www.tightvnc.com/download/2.8.90/tightvnc-2.8.90-gpl-setup-64bit.msi" `
            -OutFile $installer

          $args = @(
            "/i"
            "`"$installer`""
            "/quiet"
            "/norestart"

            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"

            "SET_PASSWORD=1"
            "VALUE_OF_PASSWORD=$env:VNC_PASSWORD"

            "SET_ALLOWLOOPBACK=1"
            "VALUE_OF_ALLOWLOOPBACK=1"

            "SET_ACCEPTRFBCONNECTIONS=1"
            "VALUE_OF_ACCEPTRFBCONNECTIONS=1"
          )

          $p = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $args `
            -Wait `
            -PassThru

          if ($p.ExitCode -ne 0) {
            throw "Error instalando TightVNC: $($p.ExitCode)"
          }

          Write-Host "[OK] TightVNC instalado."


      # ============================================================
      # INICIAR TIGHTVNC
      # ============================================================

      - name: Iniciar TightVNC
        shell: pwsh
        run: |

          $tvn = "C:\Program Files\TightVNC\tvnserver.exe"

          if (!(Test-Path $tvn)) {
            throw "No existe tvnserver.exe"
          }

          & $tvn -install -silent

          Start-Sleep -Seconds 2

          & $tvn -start -silent

          Start-Sleep -Seconds 5

          $ok = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 5900 `
            -WarningAction SilentlyContinue

          if (!$ok.TcpTestSucceeded) {
            throw "TightVNC no está escuchando en 5900"
          }

          Write-Host "[OK] TightVNC activo."


      # ============================================================
      # NOVNC
      # ============================================================

      - name: Descargar noVNC
        shell: pwsh
        run: |

          $zip = "$env:TEMP\novnc.zip"

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.7.0.zip" `
            -OutFile $zip

          Remove-Item `
            "C:\noVNC" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Expand-Archive `
            -Path $zip `
            -DestinationPath "C:\noVNC" `
            -Force

          $folder = Get-ChildItem `
            "C:\noVNC" `
            -Directory |
            Select-Object -First 1

          if ($null -eq $folder) {
            throw "No se encontró noVNC"
          }

          "NOVNC_PATH=$($folder.FullName)" >> $env:GITHUB_ENV

          Write-Host "[OK] noVNC instalado."


      # ============================================================
      # WEBSOCKIFY
      # ============================================================

      - name: Instalar Websockify
        shell: pwsh
        run: |

          python -m pip install websockify==0.13.0

          if ($LASTEXITCODE -ne 0) {
            throw "No se pudo instalar websockify"
          }

          Write-Host "[OK] Websockify instalado."


      # ============================================================
      # INICIAR NOVNC
      # ============================================================

      - name: Iniciar noVNC
        shell: pwsh
        run: |

          $out = "C:\websockify-out.log"
          $err = "C:\websockify-err.log"

          Remove-Item $out -Force -ErrorAction SilentlyContinue
          Remove-Item $err -Force -ErrorAction SilentlyContinue

          $args = @(
            "-m"
            "websockify"
            "--web"
            "$env:NOVNC_PATH"
            "0.0.0.0:6080"
            "127.0.0.1:5900"
          )

          $process = Start-Process `
            -FilePath "python.exe" `
            -ArgumentList $args `
            -RedirectStandardOutput $out `
            -RedirectStandardError $err `
            -WindowStyle Hidden `
            -PassThru

          Start-Sleep -Seconds 5

          if ($process.HasExited) {

            if (Test-Path $err) {
              Get-Content $err
            }

            throw "Websockify no inició"
          }

          $ok = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 6080 `
            -WarningAction SilentlyContinue

          if (!$ok.TcpTestSucceeded) {
            throw "noVNC no está escuchando en 6080"
          }

          Write-Host "[OK] noVNC activo."


      # ============================================================
      # CLOUDFLARE
      # ============================================================

      - name: Crear túnel Cloudflare
        shell: pwsh
        run: |

          $cloudflared = "$env:TEMP\cloudflared.exe"

          Invoke-WebRequest `
            -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" `
            -OutFile $cloudflared

          $out = "C:\cloudflare-out.log"
          $err = "C:\cloudflare-err.log"

          Remove-Item $out -Force -ErrorAction SilentlyContinue
          Remove-Item $err -Force -ErrorAction SilentlyContinue

          $cf = Start-Process `
            -FilePath $cloudflared `
            -ArgumentList @(
              "tunnel"
              "--url"
              "http://127.0.0.1:6080"
              "--no-autoupdate"
            ) `
            -RedirectStandardOutput $out `
            -RedirectStandardError $err `
            -WindowStyle Hidden `
            -PassThru

          $url = $null

          for ($i = 1; $i -le 30; $i++) {

            Start-Sleep -Seconds 2

            $text = ""

            if (Test-Path $out) {
              $text += Get-Content $out -Raw
            }

            if (Test-Path $err) {
              $text += Get-Content $err -Raw
            }

            if ($text -match "https://[a-zA-Z0-9-]+\.trycloudflare\.com") {

              $url = $matches[0]

              break
            }
          }

          if (!$url) {

            Write-Host "========== CLOUDFLARE =========="

            if (Test-Path $out) {
              Get-Content $out
            }

            if (Test-Path $err) {
              Get-Content $err
            }

            throw "No se obtuvo URL de Cloudflare"
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "       WINDOWS CLOUD PC LISTO"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "URL:"
          Write-Host "$url/vnc.html"
          Write-Host ""
          Write-Host "CONTRASEÑA:"
          Write-Host "$env:VNC_PASSWORD"
          Write-Host ""
          Write-Host "========================================"

          while ($true) {

            Start-Sleep -Seconds 30

            if ($cf.HasExited) {
              throw "Cloudflare se cerró"
            }

            if ($process.HasExited) {
              throw "Websockify se cerró"
            }
          }
