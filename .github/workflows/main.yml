name: Windows Cloud PC - TightVNC + noVNC

on:
  workflow_dispatch:

jobs:
  cloud-pc:

    runs-on: windows-2025
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. WINDOWS
      # ============================================================

      - name: Configurar Windows
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "      WINDOWS CLOUD PC"
          Write-Host "========================================"

          $theme = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"

          New-Item -Path $theme -Force | Out-Null

          Set-ItemProperty -Path $theme -Name AppsUseLightTheme -Value 0
          Set-ItemProperty -Path $theme -Name SystemUsesLightTheme -Value 0

          Write-Host "[OK] Modo oscuro activado."


      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # 3. TIGHTVNC
      # ============================================================

      - name: Instalar TightVNC
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "[1/4] Instalando TightVNC..."

          $installer = "$env:TEMP\tightvnc.msi"

          Invoke-WebRequest `
            -Uri "https://www.tightvnc.com/download/2.8.90/tightvnc-2.8.90-gpl-setup-64bit.msi" `
            -OutFile $installer

          if (!(Test-Path $installer)) {
            throw "No se pudo descargar TightVNC."
          }

          $args = @(
            "/i"
            "`"$installer`""
            "/quiet"
            "/norestart"

            "SET_USEVNCAUTHENTICATION=1"
            "VALUE_OF_USEVNCAUTHENTICATION=1"

            "SET_PASSWORD=1"
            "VALUE_OF_PASSWORD=12345678"

            # ESTA ES LA CORRECCIÓN DEL ERROR
            "SET_ALLOWLOOPBACK=1"
            "VALUE_OF_ALLOWLOOPBACK=1"

            "SET_ACCEPTRFBCONNECTIONS=1"
            "VALUE_OF_ACCEPTRFBCONNECTIONS=1"
          )

          $p = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $args `
            -Wait `
            -PassThru

          if ($p.ExitCode -ne 0) {
            throw "TightVNC falló. Código: $($p.ExitCode)"
          }

          Write-Host "[OK] TightVNC instalado."
          Write-Host "[OK] Loopback habilitado."
          Write-Host "[OK] VNC habilitado."
          Write-Host "[OK] Contraseña configurada."


      # ============================================================
      # 4. INICIAR TIGHTVNC
      # ============================================================

      - name: Iniciar TightVNC
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "[2/4] Iniciando TightVNC..."

          $tvn = "C:\Program Files\TightVNC\tvnserver.exe"

          if (!(Test-Path $tvn)) {
            throw "No existe tvnserver.exe."
          }

          & $tvn -install -silent

          Start-Sleep -Seconds 2

          & $tvn -start -silent

          Start-Sleep -Seconds 5

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 5900 `
            -WarningAction SilentlyContinue

          if (!$test.TcpTestSucceeded) {
            throw "TightVNC no está escuchando en 5900."
          }

          Write-Host "[OK] TightVNC escuchando en 5900."


      # ============================================================
      # 5. DESCARGAR NOVNC
      # ============================================================

      - name: Descargar noVNC
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "[3/4] Descargando noVNC..."

          $zip = "$env:TEMP\novnc.zip"

          Invoke-WebRequest `
            -Uri "https://github.com/novnc/noVNC/archive/refs/tags/v1.7.0.zip" `
            -OutFile $zip

          Remove-Item `
            "C:\noVNC" `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Expand-Archive `
            -Path $zip `
            -DestinationPath "C:\noVNC" `
            -Force

          $folder = Get-ChildItem `
            "C:\noVNC" `
            -Directory |
            Select-Object -First 1

          if ($null -eq $folder) {
            throw "No se encontró noVNC."
          }

          $novnc = $folder.FullName

          if (!(Test-Path "$novnc\vnc.html")) {
            throw "No se encontró vnc.html."
          }

          if (!(Test-Path "$novnc\utils\novnc_proxy")) {
            throw "No se encontró novnc_proxy."
          }

          "NOVNC_PATH=$novnc" >> $env:GITHUB_ENV

          Write-Host "[OK] noVNC instalado."
          Write-Host "[OK] $novnc"


      # ============================================================
      # 6. WEBSOCKIFY + NOVNC
      # ============================================================

      - name: Iniciar noVNC
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "[4/4] Iniciando noVNC..."

          python -m pip install websockify==0.13.0

          $novnc = $env:NOVNC_PATH

          $proxy = "$novnc\utils\novnc_proxy"

          if (!(Test-Path $proxy)) {
            throw "novnc_proxy no existe."
          }

          Write-Host "[OK] Usando TightVNC en 127.0.0.1:5900"
          Write-Host "[OK] noVNC escuchará en 0.0.0.0:6080"

          $out = "C:\novnc-out.log"
          $err = "C:\novnc-err.log"

          Remove-Item $out -Force -ErrorAction SilentlyContinue
          Remove-Item $err -Force -ErrorAction SilentlyContinue

          Start-Process `
            -FilePath "python.exe" `
            -ArgumentList @(
              $proxy
              "--vnc"
              "127.0.0.1:5900"
              "--listen"
              "0.0.0.0:6080"
            ) `
            -RedirectStandardOutput $out `
            -RedirectStandardError $err `
            -WindowStyle Hidden

          Write-Host ""
          Write-Host "Esperando noVNC..."

          $ready = $false

          for ($i = 1; $i -le 30; $i++) {

            Start-Sleep -Seconds 1

            $test = Test-NetConnection `
              -ComputerName "127.0.0.1" `
              -Port 6080 `
              -WarningAction SilentlyContinue

            if ($test.TcpTestSucceeded) {
              $ready = $true
              Write-Host "[OK] noVNC está en puerto 6080."
              break
            }

            Write-Host "Esperando... $i/30"
          }

          if (!$ready) {

            Write-Host ""
            Write-Host "========== noVNC ERROR =========="

            if (Test-Path $err) {
              Get-Content $err
            }

            Write-Host ""
            Write-Host "========== noVNC OUTPUT =========="

            if (Test-Path $out) {
              Get-Content $out
            }

            throw "noVNC no inició."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "          NOVNC LISTO"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "Puerto: 6080"
          Write-Host "URL local: http://127.0.0.1:6080/vnc.html"
          Write-Host ""
          Write-Host "Contraseña VNC: 12345678"
          Write-Host ""
          Write-Host "========================================"

          # Mantener el servidor vivo
          while ($true) {
            Start-Sleep -Seconds 60
          }
